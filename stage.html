<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stage — How it works</title>
<link rel="stylesheet" href="design-system/tokens.css" />
<link rel="stylesheet" href="debug/panel.css" />
<style id="hiw-dynamic"></style>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .test-block {
    height: 50rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-grey);
    border-top: 1px solid var(--color-bg-grey);
    border-bottom: 1px solid var(--color-bg-grey);
  }

  /* ─────────────────────────────────────────
     HOW IT WORKS SECTION
  ───────────────────────────────────────── */

  .hiw {
    /* height set by JS via scrollLength */
  }

  .hiw__sticky {
    position: sticky;
    top: var(--nav-height, 0px);
    height: calc(100vh - var(--nav-height, 0px));
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .hiw__sticky .container {
    display: flex;
    align-items: center;
  }

  /* Card */
  .hiw__card {
    display: flex;
    width: 100%;
    height: clamp(22rem, 80vh, 40rem);
    border-radius: var(--radius-xl);
    background: var(--color-bg-grey);
    overflow: hidden;
  }

  /* ── Left: accordion ── */
  .hiw__accordion {
    width: 33.33%;
    flex-shrink: 0;
    padding: var(--pad-card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }

  .hiw__highlight {
    position: absolute;
    left: var(--pad-card);
    right: var(--pad-card);
    background: var(--color-bg);
    border-radius: var(--radius-lg);
    pointer-events: none;
    z-index: 0;
    /* transition injected by applyTransitions() */
  }

  .hiw__step {
    display: flex;
    align-items: flex-start;
    gap: var(--gap-main);
    padding: 0.7rem var(--space-sm);
    border-radius: var(--radius-lg);
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: var(--font);
    flex: 0 1 auto;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .hiw__step.is-active {
    flex: 1 1 0;
    min-height: 0;
  }

  .hiw__step-num {
    flex-shrink: 0;
    color: var(--color-text-grey);
  }

  .hiw__step.is-active .hiw__step-num,
  .hiw__step.is-read   .hiw__step-num { color: var(--color-text); }

  .hiw__step-content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap-sm);
  }

  .hiw__step-title {
    color: var(--color-text-grey);
    margin: 0;
  }

  .hiw__step.is-active .hiw__step-title,
  .hiw__step.is-read   .hiw__step-title { color: var(--color-text); }

  .hiw__step-desc {
    color: var(--color-text);
    margin: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
  }

  .hiw__step.is-active .hiw__step-desc {
    max-height: 12rem;
    opacity: 1;
    /* transition injected by applyTransitions() */
  }

  /* ── Right: visual panel ── */
  .hiw__visual {
    flex: 1;
    position: relative;
    overflow: hidden;
    /* background color set by JS */
  }

  /* Each slide: image slides in from bottom, out to top */
  .hiw__slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-lg) var(--pad-card);
    will-change: transform, opacity;
    /* JS controls transform + opacity */
  }

  /* picture is transparent to flex layout so img stays a direct flex child */
  .hiw__slide picture {
    display: contents;
  }

  .hiw__slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: var(--radius-lg);
    display: block;
  }

  .hiw__coming-soon {
    position: absolute;
    bottom: var(--space-xs);
    right: var(--space-xs);
    display: flex;
    align-items: center;
    gap: var(--gap-sm);
  }

  .hiw__coming-soon-text {
    color: var(--color-text);
  }

  .hiw__platform-icons {
    display: flex;
    gap: var(--space-xxs);
  }

  .hiw__platform-icons img {
    width: 2rem;
    height: 2rem;
    border-radius: var(--radius-pill);
  }

  @media (max-width: 1279px) {
    .hiw__accordion { width: 41.67%; /* 5/12 col */ }
  }

  @media (max-width: 991px) {
    .hiw__accordion  { width: 33.33%; /* back to 4/12 col */ }
    .hiw__step-num,
    .hiw__step-title { font-size: var(--text-h5-size); line-height: var(--text-h5-lh); }
    .hiw__step-desc  { font-size: var(--text-body-size); line-height: var(--text-body-lh); }
  }

  /* ─────────────────────────────────────────
     MOBILE (≤767px) — horizontal carousel
  ───────────────────────────────────────── */

  /* Mobile text block (top of card) — hidden on desktop */
  .hiw__mob-text {
    display: none;
  }

  /* Mobile nav dots — hidden on desktop */
  .hiw__mob-dots {
    display: none;
  }

  /* Mobile arrow buttons — hidden on desktop */
  .hiw__mob-arrow {
    display: none;
  }

  @media (max-width: 767px) {

    /* Disable scroll-driven sticky */
    .hiw { height: auto !important; }

    .hiw__sticky {
      position: static;
      height: auto;
      overflow: visible;
    }

    .hiw__sticky .container {
      flex-direction: column;
      align-items: stretch;
      padding-block: var(--space-lg);
    }

    /* Card: flex-column — JS sets height to tallest content state */
    .hiw__card {
      flex-direction: column;
      align-items: stretch;
      height: auto;        /* JS: sizeMobCard() */
      background: transparent;
      position: relative;
      overflow: hidden;
    }

    /* Hide desktop accordion */
    .hiw__accordion { display: none; }

    /* Mobile text block: in-flow flex child, auto-height sized to content */
    /* JS fixes height to the tallest step so carousel transitions don't jump */
    .hiw__mob-text {
      display: flex;
      align-items: flex-start;
      gap: var(--gap-main);
      padding: var(--space-sm) var(--space-sm) var(--space-lg); /* bottom: 3rem = 48px */
      background: var(--color-bg);
      border-radius: var(--radius-lg);
      margin: var(--space-xs) var(--space-xs) 0; /* 8px from card edges, 0 bottom */
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      overflow: hidden;
    }

    .hiw__mob-num {
      flex-shrink: 0;
      color: var(--color-text);
    }

    .hiw__mob-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--gap-sm);
    }

    .hiw__mob-title,
    .hiw__mob-desc { margin: 0; color: var(--color-text); }

    /* Visual: fills remaining height, 32px gap from text block */
    .hiw__visual {
      flex: 1 0 0;
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: var(--space-md); /* 32px gap */
      aspect-ratio: unset;
    }

    /* Slides: stacked inside visual — CSS transition drives the carousel animation */
    .hiw__slide {
      padding: 0;
      align-items: flex-start;
      justify-content: flex-start;
      transition: transform 0.5s cubic-bezier(0.0, 0.0, 0.2, 1.0);
    }

    /* Card bg animates with the slide color */
    .hiw__card {
      transition: background-color 0.5s ease;
    }

    /* Arrow buttons */
    .hiw__mob-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem;
      height: 2rem;
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--radius-pill);
      color: var(--color-text);
      z-index: 2;
      cursor: pointer;
      padding: 0;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease;
    }
    .hiw__mob-arrow--prev { left: var(--space-xs); }
    .hiw__mob-arrow--next { right: var(--space-xs); }
    .hiw__mob-arrow[disabled] { opacity: 0.25; cursor: default; }

    /* picture: block on mobile so img is in-flow (override display:contents) */
    .hiw__slide picture {
      display: block;
      width: 100%;
      flex-shrink: 0;
    }

    /* Image: fills available width with left gap, natural aspect ratio, no crop */
    .hiw__slide img {
      position: static;
      display: block;
      width: 96.4%;        /* 270/280 — flush to right edge */
      margin-left: 3.6%;   /* 10/280 — left gap */
      height: auto;        /* natural aspect ratio */
      max-width: none;
      max-height: none;
      object-fit: unset;
      border-radius: var(--radius-md) 0 0 0; /* top-left only */
    }

    /* Coming soon bar: anchored to bottom of visual */
    .hiw__coming-soon {
      left: var(--space-xs);
      right: var(--space-xs);
      bottom: var(--space-xs);
      background: var(--color-bg);
      border-radius: var(--radius-md);
      padding: var(--space-xs);
      justify-content: flex-start;
      z-index: 1;
    }

    /* Icons before text on mobile */
    .hiw__platform-icons { order: -1; }

    /* Nav dots */
    .hiw__mob-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      padding: var(--space-sm) 0 0;
    }

    .hiw__mob-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: var(--radius-pill);
      background: var(--color-text-grey);
      transition: background 0.3s ease;
      flex-shrink: 0;
    }

    .hiw__mob-dot.is-active {
      background: var(--color-text);
    }
  }
</style>
</head>
<body>

<div class="test-block t-para-lg">Block before</div>

<section class="hiw" id="hiw">
  <div class="hiw__sticky">
    <div class="container">
    <div class="hiw__card" id="hiwCard">

      <!-- Mobile: text block (top of card, updated by JS) -->
      <div class="hiw__mob-text" id="hiwMobText" aria-live="polite">
        <span class="hiw__mob-num t-h5"></span>

      <div class="hiw__accordion" id="hiwAccordion">

<script>
(function () {

  var STEP_COUNT  = 5;
  var BG_COLORS   = ['#6d0092', '#005019', '#dbe96d', '#dbe96d', '#1877f2'];
  var _mobMode    = false; /* set to true on mobile — pauses LERP loop */

  var section   = document.getElementById('hiw');
  var visual    = document.getElementById('hiwVisual');
  var highlight = document.getElementById('hiwHighlight');
  var card      = document.getElementById('hiwCard');
  var accordion = document.getElementById('hiwAccordion');
  var steps     = Array.prototype.slice.call(document.querySelectorAll('.hiw__step'));
  var slides    = Array.prototype.slice.call(document.querySelectorAll('.hiw__slide'));
  var _lastIdx  = -1;
  var remPx     = parseFloat(getComputedStyle(document.documentElement).fontSize);

  function updateHighlight() {
    var active = document.querySelector('.hiw__step.is-active');
    if (!active) return;
    highlight.style.top    = (active.offsetTop    / remPx) + 'rem';
    highlight.style.height = (active.offsetHeight / remPx) + 'rem';
  }

  /* ── Config ── */
  window.C = {
    scrollLength: 5,
    eases: {
      slide:     [0.00, 0.00, 0.20, 1.00],
      highlight: [0.00, 0.00, 0.20, 1.00],
      desc:      [0.00, 0.00, 0.20, 1.00],
      bg:        [0.00, 0.00, 0.20, 1.00],
    },
    trans: {
      highlightDur: 0.6,
      descDur:      0.6,
      colorDur:     0.5,
      slideDur:     0.6,
      bgDur:        0.6,
    },
  };

  /* Apply scroll length to section height */
  window.applyScrollLength = function () {
    if (_mobMode) return; /* CSS height:auto !important handles mobile */
    section.style.height = (window.C.scrollLength * 100) + 'vh';
  };
  window.applyScrollLength();

  /* Apply CSS transitions from config */
  window.applyTransitions = function () {
    var T = window.C.trans, E = window.C.eases;
    var be = function (e) { return 'cubic-bezier(' + e.join(',') + ')'; };
    document.getElementById('hiw-dynamic').textContent =
      '.hiw__highlight { transition: top ' + T.highlightDur + 's ' + be(E.highlight) + ', height ' + T.highlightDur + 's ' + be(E.highlight) + '; }\n' +
      '.hiw__step.is-active .hiw__step-desc { transition: max-height ' + T.descDur + 's ' + be(E.desc) + ', opacity ' + (Math.round(T.descDur * 0.75 * 100) / 100) + 's ' + be(E.desc) + '; }\n' +
      '.hiw__step-num, .hiw__step-title { transition: color ' + T.colorDur + 's ease; }\n' +
      '.hiw__slide { transition: transform ' + T.slideDur + 's ' + be(E.slide) + '; }\n' +
      '.hiw__visual { transition: background-color ' + T.bgDur + 's ' + be(E.bg) + '; }';
  };
  /* applyTransitions() is NOT called at page load.
     It is called in the deferred rAF after the first snap tick,
     so no CSS transitions fire during scroll-position restoration. */

  /* ── Scroll progress: 0 when sticky starts, 1 when sticky ends ── */
  function scrollProgress() {
    var top       = section.getBoundingClientRect().top;
    var scrollable = section.offsetHeight - window.innerHeight;
    if (top > 0) return 0;
    return Math.max(0, Math.min(1, -top / scrollable));
  }

  function remap(p, lo, hi) {
    return Math.max(0, Math.min(1, (p - lo) / (hi - lo)));
  }
  window.remap = remap;


  /* ── Render ── */
  function tick(p) {
    var frac = p * (STEP_COUNT - 1);
    var idx  = Math.max(0, Math.min(STEP_COUNT - 1, Math.round(frac)));

    /* ── Accordion states ── */
    steps.forEach(function (s, i) {
      s.classList.toggle('is-active', i === idx);
      s.classList.toggle('is-read',   i < idx);
    });

    if (idx !== _lastIdx) {
      _lastIdx = idx;
      requestAnimationFrame(updateHighlight);

      /* ── Slides: CSS transition handles animation ── */
      slides.forEach(function (slide, i) {
        slide.style.transform = i === idx ? 'translateY(0%)' : (i < idx ? 'translateY(-100%)' : 'translateY(100%)');
        slide.style.zIndex    = i === idx ? 1 : 0;
      });

      /* ── Background: CSS transition handles animation ── */
      visual.style.backgroundColor = BG_COLORS[idx];
    }
  }


  /* ── Card auto-height: size to tallest accordion state ── */
  function sizeCard() {
    if (_mobMode) return;
    var accW = accordion.offsetWidth;
    if (!accW) return;

    /* Off-screen clone — same class/styles, but height:auto + overflow:visible */
    var clone = accordion.cloneNode(true);
    clone.style.cssText =
      'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;' +
      'width:' + accW + 'px;height:auto;overflow:visible;min-height:0;';
    document.body.appendChild(clone);

    var cSteps = clone.querySelectorAll('.hiw__step');
    var cDescs = clone.querySelectorAll('.hiw__step-desc');
    var maxH   = 0;

    for (var ci = 0; ci < STEP_COUNT; ci++) {
      /* Set each step as active in turn */
      cSteps.forEach(function (s, j) {
        s.classList.toggle('is-active', j === ci);
        s.classList.toggle('is-read',   j < ci);
      });
      /* Force active desc fully open (no max-height cap) */
      cDescs[ci].style.cssText = 'max-height:none;opacity:1;transition:none;overflow:visible;';
      var h = clone.scrollHeight;
      if (h > maxH) maxH = h;
      cDescs[ci].style.cssText = '';
    }

    document.body.removeChild(clone);
    if (!maxH) return;

    /* Clear inline height briefly to read the CSS clamp value */
    var prevH = card.style.height;
    card.style.height = '';
    var clampH = card.offsetHeight;
    card.style.height = prevH;

    /* Only override if content needs more space than the CSS clamp provides */
    var finalH = Math.max(maxH, clampH);
    if (finalH !== clampH) {
      card.style.height = (finalH / 16) + 'rem';
    } else {
      card.style.height = ''; /* Let CSS clamp handle it */
    }
  }

  /* Run immediately + after fonts load (font metrics change measured height) */
  sizeCard();
  document.fonts.ready.then(sizeCard);

  /* ── Mobile card height: fix to tallest text + tallest image state ── */
  function sizeMobCard() {
    if (!_mobMode) return;
    if (!mobTextEl) return;
    var cardW = card.offsetWidth;
    if (!cardW) return;

    /* ─ 1. Measure max mob-text height via off-screen clone ─ */
    var clone = mobTextEl.cloneNode(true);
    clone.style.cssText =
      'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;' +
      'width:' + mobTextEl.offsetWidth + 'px;height:auto;';
    document.body.appendChild(clone);

    var cloneNum   = clone.querySelector('.hiw__mob-num');
    var cloneTitle = clone.querySelector('.hiw__mob-title');
    var cloneDesc  = clone.querySelector('.hiw__mob-desc');
    var maxMobH = 0;
    for (var si = 0; si < STEP_COUNT; si++) {
      if (cloneNum)   cloneNum.textContent   = stepData[si].num;
      if (cloneTitle) cloneTitle.textContent = stepData[si].title;
      if (cloneDesc)  cloneDesc.textContent  = stepData[si].desc;
      var h = clone.offsetHeight;
      if (h > maxMobH) maxMobH = h;
    }
    document.body.removeChild(clone);
    if (!maxMobH) return;

    /* ─ 2. Measure max image natural height at display width ─ */
    var imgDisplayW = cardW * 0.964; /* 96.4% of card width */
    var maxImgH = 0;
    slides.forEach(function (slide) {
      var img = slide.querySelector('img');
      if (img && img.naturalWidth) {
        var imgH = Math.round(img.naturalHeight * imgDisplayW / img.naturalWidth);
        if (imgH > maxImgH) maxImgH = imgH;
      }
    });
    if (!maxImgH) return; /* images not loaded yet — will retry on window.load */

    /* ─ 3. Fix mob-text height + total card height ─ */
    mobTextEl.style.height = (maxMobH / remPx) + 'rem';

    var spaceXs = remPx * 0.5; /* --space-xs = 8px  (mob-text margin-top) */
    var spaceMd = remPx * 2;   /* --space-md = 32px (visual margin-top) */
    card.style.height = ((spaceXs + maxMobH + spaceMd + maxImgH) / remPx) + 'rem';
  }

  /* Retry after all resources loaded (images need naturalWidth/Height) */
  window.addEventListener('load', function () { if (_mobMode) sizeMobCard(); });
  document.fonts.ready.then(function () { if (_mobMode) sizeMobCard(); });

  /* ── Init without transitions ── */
  card.style.opacity = '0'; /* Hide card until snap — prevents wrong-step flash on reload */
  highlight.style.transition = 'none';
  slides.forEach(function (slide, i) { slide.style.transition = 'none'; });
  visual.style.transition = 'none';
  updateHighlight();
  slides.forEach(function (slide, i) {
    slide.style.transform = i === 0 ? 'translateY(0%)' : 'translateY(100%)';
    slide.style.zIndex    = i === 0 ? 1 : 0;
  });
  visual.style.backgroundColor = BG_COLORS[0];

  /* ── LERP loop ── */
  window.LERP = 0.04;

  var targetP      = 0;
  var currentP     = 0;
  var _rafReady    = false;
  var _transReady  = false;

  requestAnimationFrame(function loop() {
    if (_mobMode) { requestAnimationFrame(loop); return; } /* mobile handles its own carousel */
    targetP = scrollProgress();
    if (!_rafReady) {
      currentP  = targetP;   /* snap: browser has restored scroll by first rAF */
      _rafReady = true;
    }
    currentP += (targetP - currentP) * window.LERP;
    window._dbgP = currentP;
    tick(currentP);
    if (!_transReady) {
      _transReady = true;
      card.style.opacity = ''; /* Reveal card — correct state is already set */
      /* Enable CSS transitions one frame later so the snap-frame renders first */
      requestAnimationFrame(function () {
        window.applyTransitions();
        highlight.style.transition = '';
        slides.forEach(function (slide) { slide.style.transition = ''; });
        visual.style.transition = '';
      });
    }
    requestAnimationFrame(loop);
  });

  /* ── Click to jump to a step ── */
  steps.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      var frac       = i / (STEP_COUNT - 1);
      var scrollable = section.offsetHeight - window.innerHeight;
      var oldIdx     = _lastIdx;

      /* Snap background slides (not old, not new) instantly — no animation */
      slides.forEach(function (slide, j) {
        if (j !== oldIdx && j !== i) {
          slide.style.transition = 'none';
          slide.style.transform  = j < i ? 'translateY(-100%)' : 'translateY(100%)';
          slide.style.zIndex     = 0;
        }
      });

      targetP  = frac;
      currentP = frac;
      window.scrollTo(0, section.offsetTop + frac * scrollable);

      /* Re-enable transitions after tick has set positions */
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          slides.forEach(function (slide) { slide.style.transition = ''; });
        });
      });
    });
  });

  /* ── Desktop resize: recalculate highlight + card height ── */
  new ResizeObserver(function () {
    remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
    highlight.style.transition = 'none';
    updateHighlight();
    requestAnimationFrame(function () { highlight.style.transition = ''; });
    if (!_mobMode) { sizeCard(); window.applyScrollLength(); }
  }).observe(accordion);

  /* ── Mobile resize: recalculate mob card height (accordion is display:none on mobile) ── */
  new ResizeObserver(function () {
    remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
    if (_mobMode) { sizeMobCard(); }
  }).observe(card);

  /* ─────────────────────────────────────────
     MOBILE CAROUSEL
  ───────────────────────────────────────── */

  var MOB          = window.matchMedia('(max-width: 767px)');
  var _mobIdx      = 0;
  var _mobTimer    = null;
  var MOB_INTERVAL = 5000; /* 5 s auto-advance */

  /* Collect text from accordion (single source of truth) */
  var stepData = steps.map(function (btn) {
    return {
      num:   btn.querySelector('.hiw__step-num').textContent,
      title: btn.querySelector('.hiw__step-title').textContent,
      desc:  btn.querySelector('.hiw__step-desc').textContent,
    };
  });

  var mobTextEl  = document.getElementById('hiwMobText');
  var mobNumEl   = mobTextEl && mobTextEl.querySelector('.hiw__mob-num');
  var mobTitleEl = mobTextEl && mobTextEl.querySelector('.hiw__mob-title');
  var mobDescEl  = mobTextEl && mobTextEl.querySelector('.hiw__mob-desc');
  var mobDots    = Array.prototype.slice.call(document.querySelectorAll('.hiw__mob-dot'));
  var mobPrevBtn = document.getElementById('hiwMobPrev');
  var mobNextBtn = document.getElementById('hiwMobNext');

  function mobUpdateText(idx) {
    if (!mobNumEl) return;
    mobNumEl.textContent   = stepData[idx].num;
    mobTitleEl.textContent = stepData[idx].title;
    mobDescEl.textContent  = stepData[idx].desc;
  }

  function mobUpdateDots(idx) {
    mobDots.forEach(function (dot, i) {
      dot.classList.toggle('is-active', i === idx);
    });
  }

  function mobUpdateArrows(idx) {
    if (!mobPrevBtn || !mobNextBtn) return;
    mobPrevBtn.disabled = (idx === 0);
    mobNextBtn.disabled = (idx === STEP_COUNT - 1);
  }

  function mobGoTo(idx, animate) {
    idx      = Math.max(0, Math.min(STEP_COUNT - 1, idx));
    _mobIdx  = idx;

    slides.forEach(function (slide, i) {
      if (!animate) slide.style.transition = 'none';
      slide.style.transform = i === idx ? 'translateX(0%)' : (i < idx ? 'translateX(-100%)' : 'translateX(100%)');
      slide.style.zIndex    = i === idx ? 1 : 0;
    });

    visual.style.backgroundColor = BG_COLORS[idx];
    card.style.backgroundColor   = BG_COLORS[idx]; /* fill entire card bg on mobile */
    mobUpdateText(idx);
    mobUpdateDots(idx);
    mobUpdateArrows(idx);

    if (!animate) {
      requestAnimationFrame(function () {
        slides.forEach(function (slide) { slide.style.transition = ''; });
      });
    }
  }

  function mobStopTimer() {
    if (_mobTimer) { clearInterval(_mobTimer); _mobTimer = null; }
  }

  function mobStartTimer() {
    mobStopTimer();
    _mobTimer = setInterval(function () {
      mobGoTo((_mobIdx + 1) % STEP_COUNT, true);
    }, MOB_INTERVAL);
  }

  var _swipeInited  = false;
  var _arrowsInited = false;

  function mobInitSwipe() {
    if (_swipeInited) return;
    _swipeInited = true;
    var touchStartX = 0;
    var touchStartY = 0;

    visual.addEventListener('touchstart', function (e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      mobStopTimer();
    }, { passive: true });

    visual.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        mobGoTo(dx < 0 ? _mobIdx + 1 : _mobIdx - 1, true);
      }
      mobStartTimer();
    }, { passive: true });
  }

  function mobInitArrows() {
    if (_arrowsInited) return;
    _arrowsInited = true;
    if (!mobPrevBtn || !mobNextBtn) return;
    mobPrevBtn.addEventListener('click', function () {
      mobStopTimer();
      mobGoTo(_mobIdx - 1, true);
      mobStartTimer();
    });
    mobNextBtn.addEventListener('click', function () {
      mobStopTimer();
      mobGoTo(_mobIdx + 1, true);
      mobStartTimer();
    });
  }

  /* Keyboard navigation (ArrowLeft / ArrowRight) on mobile */
  document.addEventListener('keydown', function (e) {
    if (!_mobMode) return;
    if (e.key === 'ArrowLeft') {
      mobStopTimer(); mobGoTo(_mobIdx - 1, true); mobStartTimer();
    } else if (e.key === 'ArrowRight') {
      mobStopTimer(); mobGoTo(_mobIdx + 1, true); mobStartTimer();
    }
  });

  function destroyMobile() {
    _mobMode = false;
    mobStopTimer();
    mobTextEl.style.height    = ''; /* Clear JS-fixed mob-text height */
    card.style.backgroundColor = ''; /* Restore desktop --color-bg-grey from CSS */
    /* Restore slides to desktop translateY state via tick() */
    slides.forEach(function (slide) {
      slide.style.transform  = '';
      slide.style.zIndex     = '';
      slide.style.transition = '';
    });
    /* Re-apply section height + card height for current viewport */
    window.applyScrollLength();
    sizeCard();
  }

  function initMobile() {
    _mobMode = true;
    mobGoTo(0, false);       /* Set content + card.backgroundColor BEFORE revealing */
    card.style.opacity = ''; /* Reveal card — correct bg is already set */
    sizeMobCard(); /* Fix mob-text and card height to tallest content state */
    /* Re-enable visual bg transition after positions are snapped */
    requestAnimationFrame(function () { visual.style.transition = ''; });
    mobInitSwipe();
    mobInitArrows();
    mobStartTimer();
  }

  if (MOB.matches) { initMobile(); }

  MOB.addEventListener('change', function (e) {
    if (e.matches) { initMobile(); } else { destroyMobile(); }
  });

})();
</script>

      },
    ],

    sliders: [
      { label: 'LERP',      get: function () { return window.LERP; },                   set: function (v) { window.LERP = v; },                                              min: 0.01, max: 0.5,  step: 0.01, fmt: function (v) { return v.toFixed(2); } },
      { label: 'Scroll ×',  get: function () { return window.C.scrollLength; },         set: function (v) { window.C.scrollLength = v; window.applyScrollLength(); },        min: 2,    max: 10,   step: 0.5,  fmt: function (v) { return v.toFixed(1) + '×'; } },
      { label: 'Slide dur', get: function () { return window.C.trans.slideDur; },       set: function (v) { window.C.trans.slideDur = v;     window.applyTransitions(); },   min: 0.1,  max: 1.5,  step: 0.05, fmt: function (v) { return v.toFixed(2) + 's'; } },
      { label: 'BG dur',    get: function () { return window.C.trans.bgDur; },          set: function (v) { window.C.trans.bgDur = v;        window.applyTransitions(); },   min: 0.1,  max: 1.5,  step: 0.05, fmt: function (v) { return v.toFixed(2) + 's'; } },
      { label: 'HL dur',    get: function () { return window.C.trans.highlightDur; },   set: function (v) { window.C.trans.highlightDur = v; window.applyTransitions(); },   min: 0.1,  max: 1.5,  step: 0.05, fmt: function (v) { return v.toFixed(2) + 's'; } },
      { label: 'Desc dur',  get: function () { return window.C.trans.descDur; },        set: function (v) { window.C.trans.descDur = v;      window.applyTransitions(); },   min: 0.1,  max: 1.5,  step: 0.05, fmt: function (v) { return v.toFixed(2) + 's'; } },
      { label: 'Color dur', get: function () { return window.C.trans.colorDur; },       set: function (v) { window.C.trans.colorDur = v;     window.applyTransitions(); },   min: 0.1,  max: 1.5,  step: 0.05, fmt: function (v) { return v.toFixed(2) + 's'; } },
    ],

    onCopy: function () {
      var C = window.C, E = C.eases, T = C.trans;
      var fe = function (e) { return '[' + e.map(function (v) { return +v.toFixed(2); }).join(', ') + ']'; };
      return 'window.C = {\n' +
        '  scrollLength: ' + C.scrollLength + ',\n' +
        '  eases: {\n' +
        '    slide:     ' + fe(E.slide)     + ',\n' +
        '    highlight: ' + fe(E.highlight) + ',\n' +
        '    desc:      ' + fe(E.desc)      + ',\n' +
        '    bg:        ' + fe(E.bg)        + ',\n' +
        '  },\n' +
        '  trans: {\n' +
        '    slideDur:     ' + T.slideDur     + ',\n' +
        '    bgDur:        ' + T.bgDur        + ',\n' +
        '    highlightDur: ' + T.highlightDur + ',\n' +
        '    descDur:      ' + T.descDur      + ',\n' +
        '    colorDur:     ' + T.colorDur     + ',\n' +
        '  },\n};\n' +
        'window.LERP = ' + window.LERP + ';';
    },

  document.getElementById('dbg').classList.add('collapsed');
})();
