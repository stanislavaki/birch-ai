<!-- ═══════════════════════════════════════════════════════════════
     Birch AI card — image container
     Drop into the HTML Embed inside the card's image container.
     Background/padding of the card come from Webflow; this block adds none.
     ═══════════════════════════════════════════════════════════════ -->
<style>
  /* Webflow wraps every embed in .w-embed. In a flex slot that wrapper is a
     flex item sized by its content, so a % width inside would collapse to 0 —
     pin it to full width. */
  .w-embed:has(> .promo-ai-e) { width: 100%; }

  /* the mockup window. A query container so the popover's OWN cqw props
     (radius, shadow) resolve against this width and not the viewport. */
  .promo-ai-e {
    position: relative;
    width: 100%;
    border-radius: 0.75rem;
    overflow: hidden;
    box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.18);
    container-type: inline-size;
    font-family: "TT Commons Pro Variable", Arial, sans-serif;
  }
  .promo-ai-e__bg { width: 100%; height: auto; display: block; }

  /* chat popover — FIXED height, so the window never grows while typing */
  .promo-ai-e__pop {
    position: absolute;
    left: 57%;
    top: 15%;
    width: 41%;
    height: 81%;
    background: #fff;
    border-radius: 1.8cqw;
    box-shadow: 0 1cqw 3cqw rgba(0, 0, 0, 0.22);
    container-type: inline-size;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(3%) scale(0.96);
    transform-origin: 72% 22%;
    transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .promo-ai-e.is-live .promo-ai-e__pop { opacity: 1; transform: none; }

  /* everything inside scales off the popover width */
  .promo-ai-e__head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4.2cqw 5.5cqw 2cqw !important;
  }
  .promo-ai-e__head-title { font-size: 4.6cqw; font-weight: 600; color: #111; }
  .promo-ai-e__head-icons { display: flex; gap: 2.6cqw; color: #b3b3b3; }
  .promo-ai-e__head-icons svg { width: 3.8cqw; height: 3.8cqw; display: block; }

  .promo-ai-e__feed {
    flex: 1 1 auto;
    overflow: hidden;
    padding: 0 5.5cqw !important;
  }
  .promo-ai-e__bubble {
    margin: 0 0 0 auto;
    width: fit-content;
    max-width: 90%;
    background: #f1f1f3;
    border-radius: 3.4cqw;
    padding: 3cqw 3.6cqw !important;
    font-size: 4.2cqw;
    line-height: 1.26;
    color: #111;
    opacity: 0;
    transform: translateY(1.5cqw) scale(0.98);
    transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .promo-ai-e__bubble.is-in { opacity: 1; transform: none; }

  .promo-ai-e__resp {
    margin-top: 3.4cqw;
    font-size: 4.2cqw;
    line-height: 1.3;
    color: #111;
    opacity: 0;
    transform: translateY(1cqw);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .promo-ai-e__resp.is-in { opacity: 1; transform: none; }
  .promo-ai-e__lead { margin: 0; color: #444; }
  .promo-ai-e__rule { margin-top: 2.6cqw; }
  .promo-ai-e__rule-title { font-weight: 700; }
  .promo-ai-e__rule-more { color: #9a9a9a; font-size: 3.7cqw; margin-top: 0.6cqw; }

  .promo-ai-e__btn {
    display: inline-flex;
    align-items: center;
    margin-top: 3.2cqw;
    padding: 2.4cqw 4cqw !important;
    background: #FFE243;
    border-radius: 9999px;
    font-size: 3.9cqw;
    font-weight: 600;
    color: #111;
  }

  /* input pinned at the bottom — the request types in HERE, then it is sent */
  .promo-ai-e__input {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2cqw;
    margin: 2.5cqw 5.5cqw 5cqw;
    padding: 3cqw 2.6cqw 3cqw 3.8cqw !important;
    border: 0.5cqw solid #e6e6e8;
    border-radius: 7.2cqw;
    font-size: 4.1cqw;
  }
  .promo-ai-e__input-text {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    white-space: nowrap;
    overflow: hidden;
  }
  .promo-ai-e__typed { color: #111; }
  .promo-ai-e__ph { color: #9a9a9a; }
  .promo-ai-e__caret {
    flex: 0 0 auto;
    width: 0.4cqw;
    height: 4.6cqw;
    margin-left: 0.3cqw;
    background: #111;
    opacity: 0;
  }
  .promo-ai-e__pop.is-typing .promo-ai-e__caret { animation: promoAiCaret 1.05s steps(1) infinite; }
  @keyframes promoAiCaret { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }
  .promo-ai-e__send {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 7cqw;
    height: 7cqw;
    border-radius: 50%;
    background: #ececef;
    color: #9a9a9a;
  }
  .promo-ai-e__send svg { width: 4.2cqw; height: 4.2cqw; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .promo-ai-e__pop,
    .promo-ai-e__resp,
    .promo-ai-e__bubble { transition: none; opacity: 1; transform: none; }
  }
</style>

<div class="promo-ai-e" id="promoAiShot">
  <img class="promo-ai-e__bg" src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a627163e058d35a3e3b57ca_Birch%20AI-bg.jpg" alt="" />

  <div class="promo-ai-e__pop" id="promoAiPop">
    <div class="promo-ai-e__head">
      <span class="promo-ai-e__head-title">New chat</span>
      <span class="promo-ai-e__head-icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </span>
    </div>

    <div class="promo-ai-e__feed">
      <div class="promo-ai-e__bubble" id="promoAiBubble">Create a rule to Pause ad sets: 3-day spend over $100 and cost per purchase above $40</div>

      <div class="promo-ai-e__resp" id="promoAiResp">
        <p class="promo-ai-e__lead">Got it. Here&rsquo;s a rule based on your conditions:</p>
        <div class="promo-ai-e__rule">
          <div class="promo-ai-e__rule-title">Pause ad sets &mdash; high spend, low efficiency</div>
          <div class="promo-ai-e__rule-more">Conditions &rsaquo;</div>
        </div>
        <div class="promo-ai-e__btn">Review and set live rule</div>
      </div>
    </div>

    <div class="promo-ai-e__input">
      <span class="promo-ai-e__input-text"><span class="promo-ai-e__typed" id="promoAiTyped"></span><span class="promo-ai-e__ph" id="promoAiPh">Ask anything</span><span class="promo-ai-e__caret"></span></span>
      <span class="promo-ai-e__send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </span>
    </div>
  </div>
</div>

<script>
(function () {
  var LEAD_IN  = 700;   /* hold once in view, so the viewer catches the start */
  var APPEAR   = 750;   /* let the popover settle before the message starts */
  var TYPE_MS  = 22;    /* per character */
  var RESP_GAP = 420;   /* beat between the message landing and the reply */

  function init() {
    var shot   = document.getElementById('promoAiShot');
    var pop    = document.getElementById('promoAiPop');
    var bubble = document.getElementById('promoAiBubble');
    var resp   = document.getElementById('promoAiResp');
    var typed  = document.getElementById('promoAiTyped');
    var ph     = document.getElementById('promoAiPh');
    if (!shot || !pop || !bubble || !resp) return;

    var full = bubble.textContent;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      shot.classList.add('is-live');
      bubble.classList.add('is-in');
      resp.classList.add('is-in');
      return;
    }

    typed.textContent = '';

    /* PHASE 1 - type the request into the input field */
    function typeInput(i) {
      if (i > full.length) { setTimeout(send, 280); return; }
      if (i === 1) ph.style.display = 'none';
      typed.textContent = full.slice(0, i);
      setTimeout(function () { typeInput(i + 1); }, TYPE_MS);
    }

    /* PHASE 2 - send: input clears, the bubble floats up, then the reply */
    function send() {
      pop.classList.remove('is-typing');
      typed.textContent = '';
      ph.style.display = '';
      bubble.classList.add('is-in');
      setTimeout(function () { resp.classList.add('is-in'); }, RESP_GAP);
    }

    function play() {
      shot.classList.add('is-live');
      setTimeout(function () {
        pop.classList.add('is-typing');
        typeInput(0);
      }, APPEAR);
    }

    var started = false;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !started) {
          started = true;
          io.disconnect();
          setTimeout(play, LEAD_IN);
        }
      });
    }, { threshold: 0.6 });
    io.observe(shot);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
