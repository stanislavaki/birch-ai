<!-- ===== BIRCH: PRODUCT UPDATE BANNER =====
     Place above the header/nav. Desktop only for now.
     Source of truth: design-system/components/product-banner.css
     Figma: Website 2026 / "Product updates banner" (18332-4305)

     No background here on purpose - it comes from Webflow.
     No horizontal padding on the root - the section supplies it.
     ASCII only (Webflow mangles non-ASCII on save), including comments.
===== -->
<style>
.pub-e {
  /* Tokens declared on the embed root so nothing leaks in from the site.
     Container width in px, not rem: fluid root font-size would stretch it. */
  --pub-font: "TT Commons Pro Variable", "Inter", Arial, sans-serif;
  --pub-white: #FFFFFF;
  --pub-radius: 0.5rem;      /* 8px  - radius-sm */
  --pub-inset: 0.25rem;      /* 4px  - space-xxs */
  --pub-gap: 0.5rem;         /* 8px  - gap-sm */
  --pub-container: 1600px;   /* container-lg */

  /* Component colours: Meta brand blue + one-off dark ink */
  --pub-ink: #161616;
  --pub-accent: #0081FB;

  /* Off-token paddings, kept to match the Figma optical centring */
  --pub-pad-top: 1.125rem;    /* 18px */
  --pub-pad-bottom: 1.25rem;  /* 20px */
  --pub-pad-start: 1.375rem;  /* 22px */
  --pub-pad-link: 0.875rem;   /* 14px */

  box-sizing: border-box;
  width: 100%;
  max-width: var(--pub-container);
  margin-inline: auto;
  padding: var(--pub-inset) !important;
  text-align: left;
}

/* The .w-embed wrapper collapses to 0 inside a flex slot - force it wide. */
.w-embed:has(> .pub-e) { width: 100%; }

.pub-e *,
.pub-e *::before,
.pub-e *::after { box-sizing: border-box; }

/* Zero-specificity reset: only properties the component sets by class,
   so a site rule on a bare tag can never outrank the component. */
.pub-e :where(p) { margin: 0; }

.pub-e__bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--pub-gap);
  background: var(--pub-white);
  border-radius: var(--pub-radius);
  font-family: var(--pub-font);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  text-align: left;
}

/* Left label */
.pub-e__label {
  display: flex;
  align-items: center;
  flex: none;
  /* Webflow's global reset strips padding - hold it with !important. */
  padding: var(--pub-pad-top) 0 var(--pub-pad-bottom) var(--pub-pad-start) !important;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  white-space: nowrap;
}

/* Centre message */
.pub-e__message {
  display: flex;
  align-items: center;
  gap: var(--pub-gap);
  min-width: 0;
  /* Same vertical padding as label and link. Without it the unpadded
     message centres 1px lower than they do (the asymmetric 18/20
     padding puts their line box at y=18, plain centring at y=19) and
     the three baselines drift apart. */
  padding: var(--pub-pad-top) 0 var(--pub-pad-bottom) !important;
}

/* Product mark slot - swap the svg, or drop the element entirely. */
.pub-e__mark {
  display: flex;
  align-items: center;
  flex: none;
}
.pub-e__mark > svg,
.pub-e__mark > img {
  display: block;
  height: 1.125rem; /* 18px */
  width: auto;
  max-width: none;
  /* Renders 18px but occupies the 16px text row, so the mark never
     drives the row height and shifts the baselines down. */
  margin-block: -0.0625rem;
}

.pub-e__text {
  margin: 0 !important;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* Class selector (0,1,0) beats the site's bare `p { font-size: 14.4px }` */
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  max-width: none;
}

.pub-e__tag {
  color: var(--pub-accent);
  margin-inline-end: 0.25rem;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.004em;
}

/* Right link */
.pub-e__link {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  padding: var(--pub-pad-top) var(--pub-pad-link) var(--pub-pad-bottom) !important;
  border-radius: var(--pub-radius);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-accent);
  text-decoration: none;
  white-space: nowrap;
  transition: opacity 0.15s ease;
}
.pub-e__link:hover { opacity: 0.85; color: var(--pub-accent); }

/* Mobile <=767px: drop the label so the message gets the width. The
   label was carrying the left inset, so hand it to the message,
   otherwise the text sits flush against the bar edge. */
@media (max-width: 767px) {
  .pub-e__label { display: none !important; }
  .pub-e__message { padding-inline-start: var(--pub-pad-start) !important; }
}
</style>
