<!-- ===== BIRCH: PRODUCT UPDATE BANNER =====
     Pinned above the header/nav.
     Source of truth: embed/product-banner-embed.html in the birch-ai repo.
     Figma: Website 2026 / "Product updates banner" (18332-4305)

     ASCII only (Webflow mangles non-ASCII on save), including comments.
===== -->
<style>
/* Banner height as a constant the nav offset can be built on. It has to be
   ONE number: the site root font-size is fluid, so while these paddings were
   in rem the bar measured 44px at 1024 and 59px at 1600, and a nav pushed
   down by a moving value tears away from the banner as you resize.
   4 inset + 18 top + 13 text + 20 bottom + 4 inset = 59. Declared on :root
   so the nav rules below can read it - a custom property set on .pub-e
   inherits downward only. */
:root { --pub-h: 59px; }

.pub-e {
  /* Tokens declared on the embed root so nothing leaks in from the site.
     Sizes in px, not rem: the fluid root would stretch every one of them. */
  --pub-font: "TT Commons Pro Variable", "Inter", Arial, sans-serif;
  --pub-white: #FFFFFF;
  --pub-radius: 8px;       /* radius-sm */
  --pub-inset: 4px;        /* space-xxs */
  --pub-gap: 8px;          /* gap-sm */
  --pub-container: 1600px; /* container-lg */

  /* Component colours: Meta brand blue + one-off dark ink */
  --pub-ink: #161616;
  --pub-accent: #0081FB;

  /* Off-token paddings, kept to match the Figma optical centring */
  --pub-pad-top: 18px;
  --pub-pad-bottom: 20px;
  --pub-pad-start: 22px;
  --pub-pad-link: 14px;

  box-sizing: border-box;
  /* Pinned to the very top of the viewport, above the nav. The nav cannot
     be pushed down by document order - .nav2 is position: fixed, so it
     ignores flow entirely - which is why the banner joins it in the pinned
     layer rather than trying to sit above it in the document. */
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1001;           /* .nav2 is 1000 - the banner paints over it */
  width: 100%;
  max-width: var(--pub-container);
  margin-inline: auto;
  padding: var(--pub-inset) !important;
  text-align: left;
}

/* ---- Site integration: make room for the pinned banner ----
   The nav is fixed (.nav2 is the desktop pill, .nav2m the SEPARATE mobile
   bar, both z 1000), so document order cannot push it down - it joins the
   banner in the pinned layer and gets offset by --pub-h instead. .nav2m is
   easy to miss: it only exists below the breakpoint, where .nav2 is
   display: none, so a desktop-only check passes while the phone is broken.

   The flow reserve goes on BODY, not on a wrapper class. Surveyed eight
   live templates (09.2026): .page-wrapper exists on / and /mcp only -
   /pricing wraps in .new-page-to-test, and /blog/*, /case-studies/*,
   /legal/*, /demo, /analyze have no wrapper at all, just nav.nav-v3-root
   followed by loose sections. Padding .page-wrapper therefore reserved the
   banner's height on two pages out of eight and let the first section slide
   under the bar everywhere else. body is the one box every template has,
   and it is display: block with zero margin and padding on all of them.
   nav.nav-v3-root is static and carries the nav's own flow reserve, so
   padding body moves nav and content together and the offset .nav2 stays
   sitting on it.

   .container.intro sizes the first screen against the viewport minus the
   nav, so it has to lose the banner too or the hero overflows by --pub-h.
   (It already runs ~9px past the fold without the banner - that is the
   known --nav-height slack, not this rule.)

   .nav2m__blur is deliberately NOT offset: it is the full-viewport backdrop
   behind the open mobile menu (z 5, below both bars), and it should keep
   covering the whole screen, banner included. The legacy .nav flow spacer
   is gone from every template - it was replaced during the menu v3 port,
   so no rule targets it any more.

   These rules live inside the banner's own <style> deliberately. Webflow
   omits a visibility-false element from the published DOM entirely (checked
   against this nav's own "Search field" and "link 6" props, which emit no
   node at all), so switching the component's "Show banner" prop to Hidden
   takes this block with it and the nav springs back to top: 0 on its own.
   Nothing to clean up when the campaign ends.

   Corollary, and the reason the banner belongs on EVERY page: these offsets
   ship with the banner, so a page without it keeps the nav at top: 0. Mixed
   placement makes the header jump as you move between pages. */
body   { padding-top: var(--pub-h) !important; }
.nav2  { top: var(--pub-h) !important; }
.nav2m { top: var(--pub-h) !important; }
.container.intro { min-height: calc(100svh - var(--nav-height) - var(--pub-h)) !important; }

/* The .w-embed wrapper collapses to 0 inside a flex slot - force it wide. */
.w-embed:has(> .pub-e) { width: 100%; }

.pub-e *,
.pub-e *::before,
.pub-e *::after { box-sizing: border-box; }

/* Zero-specificity reset: only properties the component sets by class,
   so a site rule on a bare tag can never outrank the component. */
.pub-e :where(p) { margin: 0; }

.pub-e__bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--pub-gap);
  background: var(--pub-white);
  border-radius: var(--pub-radius);
  font-family: var(--pub-font);
  /* 13px flat, desktop and mobile, to buy the message more characters.
     px on purpose, and the one place this file breaks the project's
     no-px rule: the live site sets a FLUID root font-size, so a rem
     here would breathe with the viewport (0.8125rem renders 10.6px at
     1024 and 15.6px at 1600) and the "always fits" budget would move
     with it. Same reason --pub-container is stated in px above.
     design-system/components/product-banner.css says 0.8125rem for the
     same 13px, because it renders on a fixed 16px root. */
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  text-align: left;
}

/* Left label */
.pub-e__label {
  /* Not a flex container, for the same reason as .pub-e__link below: a
     flex item would not share a line box with the label text, and the
     colon has to sit tight against it. Vertical position comes from the
     padding, so nothing is lost. */
  display: block;
  flex: none;
  /* Webflow's global reset strips padding - hold it with !important. */
  padding: var(--pub-pad-top) 0 var(--pub-pad-bottom) var(--pub-pad-start) !important;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  white-space: nowrap;
}

/* The colon only exists where the label runs into the message, which is
   the joined mobile line. On desktop the label is its own item on the far
   left of a space-between row, with nothing after it to introduce - a
   colon there dangles. Marked up rather than generated so that whoever
   swaps the campaign copy can see it. */
.pub-e__label-colon { display: none; }

/* The x is a joiner, not a word - held back so the two brand names carry
   the line. Opacity rather than a grey literal, so it keeps tracking
   --pub-ink if the ink ever changes.

   Spacing as a margin rather than space characters: em, so it scales with
   the type, and one number to tune. 0.125em is about half a word space at
   this size (1.6px at 13px) - enough to separate the names without the x
   reading as its own word. A full en (0.5em a side) costs 12px, which the
   joined mobile line at 375 does not have. */
.pub-e__label-x {
  opacity: 0.35;
  margin-inline: 0.125em;
  /* Optically 1px down at the 13px kegl: the x sits on the x-height while
     the caps either side run taller, so a mathematically centred glyph
     reads high. Relative offset, not vertical-align - vertical-align can
     grow the line box, and the bar height is a constant the nav offset is
     built on. em so the nudge scales with the type. */
  position: relative;
  top: 0.077em;
}

/* Centre message */
.pub-e__message {
  display: flex;
  align-items: center;
  gap: var(--pub-gap);
  min-width: 0;
  /* Same vertical padding as label and link. Without it the unpadded
     message centres 1px lower than they do (the asymmetric 18/20
     padding puts their line box at y=18, plain centring at y=19) and
     the three baselines drift apart. */
  padding: var(--pub-pad-top) 0 var(--pub-pad-bottom) !important;
}

/* Product mark slot - swap the svg, or drop the element entirely. */
.pub-e__mark {
  display: flex;
  align-items: center;
  flex: none;
}
.pub-e__mark > svg,
.pub-e__mark > img {
  display: block;
  /* em, not rem: the mark has to shrink with the text, or it towers over
     the 13px copy. 1.125em holds the designed 18/16 ratio - 14.6px at the
     current size - and keeps the mark taller than its row, so it never
     drives the row height and shifts the baselines down.

     The current campaign carries no mark - the label names both brands in
     words - but the slot stays. If you add one back, give the svg width and
     height ATTRIBUTES (e.g. 22x15, matching its ratio). They are inert on
     the live page - a presentation attribute loses to any CSS rule - but
     the Designer canvas does not run embed <style>, and without them the
     logo has no intrinsic size there and blows up to fill the whole canvas,
     burying the page you are trying to edit. */
  height: 1.125em;
  width: auto;
  max-width: none;
  margin-block: -0.0625em;
}

.pub-e__text {
  margin: 0 !important;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  /* Class selector (0,1,0) beats the site's bare `p { font-size: 14.4px }` */
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-ink);
  max-width: none;
}

.pub-e__tag {
  color: var(--pub-accent);
  margin-inline-end: 4px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.004em;
}

/* Right link */
.pub-e__link {
  /* Deliberately not a flex container: flex items discard the
     whitespace between them, so the label and its .pub-e__link-tail
     would render glued together. Normal inline flow keeps the
     word space. Vertical position comes from the padding, so
     nothing is lost by dropping flex here. */
  display: block;
  flex: none;
  text-align: center;
  padding: var(--pub-pad-top) var(--pub-pad-link) var(--pub-pad-bottom) !important;
  border-radius: var(--pub-radius);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.004em;
  color: var(--pub-accent);
  text-decoration: none;
  white-space: nowrap;
  transition: opacity 0.15s ease;
}
.pub-e__link:hover { opacity: 0.85; color: var(--pub-accent); }

/* New-tab marker. The link leaves the site, so it opens in a new tab and
   says so: this glyph for people who can see it, .pub-e__sr for people who
   cannot. rel="noopener" is the other half - without it the destination
   gets a window.opener handle and can redirect the page behind it.

   Sized in em so it tracks the type, and stroke rather than fill so it
   stays crisp at ~10px. The negative block margins are the same trick as
   .pub-e__mark: they shrink the margin box the line box is measured from,
   so a glyph taller than the 13px strut cannot grow the bar - and the bar
   height is a constant the nav offset is built on. */
.pub-e__ext {
  display: inline-block;
  width: 0.82em;
  height: 0.82em;
  margin-inline-start: 0.34em;
  margin-block: -0.12em;
  /* 1px up at the 13px kegl, to sit on the text baseline. */
  vertical-align: 0.02em;
}

/* Visually hidden, still read aloud. The icon carries the message for
   sighted users; screen readers get it here. A span rather than an
   aria-label on the link, because aria-label REPLACES the accessible name:
   with a .pub-e__link-tail in play the visible text changes by breakpoint,
   and a fixed label would stop matching it (WCAG 2.5.3). */
.pub-e__sr {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 767px) {
  /* Two label modes, because the label plays two different parts depending
     on the copy. By default it is a standing tag ("Product update") - dead
     weight on a phone, so it is dropped and the message takes the width.
     With .pub-e--joined it opens the sentence ("Meta x Birch:") and cannot
     be dropped: it stays, and the message joins it into a single line.
     Which mode a campaign is in is a copy decision, so it rides on a class
     on the wrapper rather than being baked into the breakpoint. */

  /* Default: drop the label. It was carrying the left inset, so hand that
     to the message, otherwise the text sits flush against the bar edge. */
  .pub-e__label { display: none !important; }
  .pub-e__message { padding-inline-start: var(--pub-pad-start) !important; }

  /* Message and link both drop their trailing words. Only the droppable
     tail is marked up - the short form is the plain text ahead of it, so
     no copy is duplicated. Verbs lead in the link, so what survives is the
     call to action, not a noun: "Register to webinar" -> "Register". */
  .pub-e__text-tail,
  .pub-e__link-tail { display: none !important; }

  /* ---- .pub-e--joined: label and message read as one line ---- */

  .pub-e--joined .pub-e__label { display: block !important; }
  .pub-e--joined .pub-e__label-colon { display: inline; }

  /* The bar's 8px gap would read as a pause mid-sentence - a word space
     instead. The message then absorbs the free space, so the pair hugs the
     left inset the label carries and the link stays hard right. */
  .pub-e--joined .pub-e__bar { column-gap: 0.25em; }
  .pub-e--joined .pub-e__message {
    padding-inline-start: 0 !important;
    margin-inline-end: auto;
  }

  /* A product mark anchors the message on desktop, where the message is
     its own centred item. Inside the joined sentence it would interrupt
     the line - and a sentence-opening label already names the product.
     (The live campaign carries no mark at all; this covers a later one
     that does.) */
  .pub-e--joined .pub-e__mark { display: none !important; }

  /* Sentence case: on desktop the message is a separate item and opens
     with a capital; joined after the label's colon it is a fragment, so it
     lowercases. Cheaper and safer than a second copy of the string. */
  .pub-e--joined .pub-e__text::first-letter { text-transform: lowercase; }

  /* 22/14 are desktop-generous insets. Joined, the whole bar is a single
     width budget and the line needs every pixel of them back. */
  .pub-e--joined { --pub-pad-start: 10px; --pub-pad-link: 6px; }

  /* Below the width where the short form fits, the message still truncates
     with an ellipsis - fitting the narrowest phone is an editing job, not
     a layout one. Measured budget: see the styleguide spec table. */
}
</style>

<div class="pub-e pub-e--joined">
  <div class="pub-e__bar">
    <div class="pub-e__label">Meta<span class="pub-e__label-x">&times;</span>B&iuml;rch<span class="pub-e__label-colon">:</span></div>
    <div class="pub-e__message">
      <p class="pub-e__text">From benchmarks<span class="pub-e__text-tail"> and creative data</span> to ad automation<span class="pub-e__text-tail">, with the Ads MCP server</span></p>
    </div>
    <a class="pub-e__link" href="https://luma.com/z361px9u?utm_campaign=ai_meta_mcp&amp;utm_source=announcement_bar" target="_blank" rel="noopener">Register<svg class="pub-e__ext" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 6.75V9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h2.25"/><path d="M7.75 2H10v2.25"/><path d="M10 2 5.75 6.25"/></svg><span class="pub-e__sr"> (opens in a new tab)</span></a>
  </div>
</div>
