.hse-hs__frag {

  --pw2: calc(var(--w2) * var(--u) + var(--up) * var(--dw2) / 186);

  --centre: calc(50cqw - var(--cx) * var(--u));

  position: absolute;
  display: block;
  left:    calc((1 - var(--t)) * var(--px1) + var(--t) * var(--px2) + var(--centre));
  top:     calc((1 - var(--t)) * var(--py1) + var(--t) * var(--py2));
  width:   calc((1 - var(--t)) * var(--pw1) + var(--t) * var(--pw2));
  height:  auto;
  rotate:  calc(((1 - var(--t)) * var(--r) + var(--t) * var(--r2)) * 1deg);
  transform-origin: center;

  opacity: calc(((1 - var(--t)) * var(--o1) + var(--t) * var(--o2)) * var(--lit, 1) * var(--hse-in, 1));

  border-radius: 0;

.hse-hs__frag--sized {

  content: "";
