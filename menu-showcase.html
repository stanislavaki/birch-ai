<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birch — New Menu showcase</title>
<style>
/* Presentation page for design review: one page, two tabs.
   Desktop tab: both themes side by side at full desktop width (scaled).
   Mobile tab: both themes side by side, menu opened.
   Each frame is the live prototype; the dev panel inside starts collapsed. */
* { box-sizing: border-box; }
body { margin: 0; background: #000; font-family: Arial, sans-serif; }
.bar {
  height: 3rem;
  display: flex; align-items: center; gap: 1rem;
  padding: 0 1rem;
  color: #fff; font-size: 0.9rem;
  background: #111; border-bottom: 1px solid #2a2a2a;
}
.bar .title { font-weight: 700; margin-right: 1rem; }
.tab {
  font: inherit; padding: 0.4rem 1.2rem; cursor: pointer;
  background: #1c1c1c; color: #999; border: 1px solid #444; border-radius: 0.5rem;
}
.tab.is-on { background: #3a3a3a; color: #fff; border-color: #777; }
.bar .hint { color: #777; margin-left: auto; }

.view { display: none; height: calc(100vh - 3rem); }
.view.is-on { display: flex; }

/* desktop: two scaled halves */
.view--desktop .half { position: relative; width: 50%; overflow: hidden; }
.view--desktop .half + .half { border-left: 2px solid #333; }
.view--desktop iframe { border: none; transform-origin: top left; }

/* mobile: two phones */
.view--mobile { justify-content: center; gap: 1.5rem; padding: 1.5rem; }
.view--mobile iframe { width: 390px; height: 100%; border: 1px solid #333; border-radius: 0.75rem; background: #111; }

.lbl {
  position: absolute; top: 0.4rem; left: 0.5rem; z-index: 10;
  background: #9f9; color: #000; font-weight: 700;
  padding: 0.1rem 0.5rem; border-radius: 0.3rem; font-size: 0.8rem;
}
.ph { position: relative; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Birch — новое меню</span>
  <button type="button" class="tab is-on" data-view="desktop">Десктоп</button>
  <button type="button" class="tab" data-view="mobile">Мобилка</button>
  <span class="hint">слева тёмная тема, справа светлая; всё живое — ховеры и клики работают</span>
</div>

<div class="view view--desktop is-on" id="view-desktop">
  <div class="half"><span class="lbl">dark</span>
    <iframe id="dd" src="menu.html?panel=min"></iframe>
  </div>
  <div class="half"><span class="lbl">light</span>
    <iframe id="dl" src="menu.html?panel=min&theme=light"></iframe>
  </div>
</div>

<div class="view view--mobile" id="view-mobile">
  <div class="ph"><span class="lbl">dark</span>
    <iframe id="md" src="menu.html?open=1&panel=min"></iframe>
  </div>
  <div class="ph"><span class="lbl">light</span>
    <iframe id="ml" src="menu.html?open=1&panel=min&theme=light"></iframe>
  </div>
</div>

<script>
/* tabs */
document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('is-on', x === t); });
    document.getElementById('view-desktop').classList.toggle('is-on', t.getAttribute('data-view') === 'desktop');
    document.getElementById('view-mobile').classList.toggle('is-on', t.getAttribute('data-view') === 'mobile');
  });
});

/* desktop halves render at full width and scale down to fit */
var BASE_W = 1280;
var dframes = [document.getElementById('dd'), document.getElementById('dl')];
function layout() {
  var half = document.querySelector('.view--desktop .half');
  if (!half) return;
  var scale = half.clientWidth / BASE_W;
  var h = (window.innerHeight - document.querySelector('.bar').offsetHeight) / scale;
  dframes.forEach(function (f) {
    f.style.width = BASE_W + 'px';
    f.style.height = h + 'px';
    f.style.transform = 'scale(' + scale + ')';
  });
}
layout();
window.addEventListener('resize', layout);

/* mirror background scroll between the desktop halves */
function innerWin(f) {
  try {
    var m = f.contentDocument && f.contentDocument.querySelector('.mock-frame');
    return m && m.contentWindow ? m.contentWindow : null;
  } catch (e) { return null; }
}
function jump(w, y) { w.scrollTo({ top: y, behavior: 'instant' }); }
var last = [0, 0];
(function sync() {
  var wins = dframes.map(innerWin);
  if (wins[0] && wins[1]) {
    var y = [wins[0].scrollY, wins[1].scrollY];
    if (y[0] !== last[0]) { jump(wins[1], y[0]); }
    else if (y[1] !== last[1]) { jump(wins[0], y[1]); }
    last = [wins[0].scrollY, wins[1].scrollY];
  }
  requestAnimationFrame(sync);
})();
</script>
</body>
</html>
