<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birch — New Menu showcase</title>
<style>
/* Presentation page for design review: one page, two tabs.
   Desktop tab: both themes side by side at full desktop width (scaled).
   Mobile tab: both themes side by side, menu opened.
   Each frame is the live prototype; the dev panel inside starts collapsed. */
* { box-sizing: border-box; }
body { margin: 0; background: #000; font-family: Arial, sans-serif; }
.bar {
  height: 3rem;
  display: flex; align-items: center; gap: 1rem;
  padding: 0 1rem;
  color: #fff; font-size: 0.9rem;
  background: #111; border-bottom: 1px solid #2a2a2a;
}
.bar .title { font-weight: 700; margin-right: 1rem; }
.tab {
  font: inherit; padding: 0.4rem 1.2rem; cursor: pointer;
  background: #1c1c1c; color: #999; border: 1px solid #444; border-radius: 0.5rem;
}
.tab.is-on { background: #3a3a3a; color: #fff; border-color: #777; }
.bar .hint { color: #777; margin-left: auto; }

.view { display: none; height: calc(100vh - 3rem); }
.view.is-on { display: flex; }

/* desktop: one full-size live frame, theme switched from the top bar */
.view--desktop iframe { width: 100%; height: 100%; border: none; }
.tab--sm { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
.theme-tabs { display: flex; gap: 0.25rem; margin-left: 1rem; }

/* mobile: two phones */
.view--mobile { justify-content: center; gap: 1.5rem; padding: 1.5rem; }
.view--mobile iframe { width: 390px; height: 100%; border: 1px solid #333; border-radius: 0.75rem; background: #111; }

.lbl {
  position: absolute; top: 0.4rem; left: 0.5rem; z-index: 10;
  background: #9f9; color: #000; font-weight: 700;
  padding: 0.1rem 0.5rem; border-radius: 0.3rem; font-size: 0.8rem;
}
.ph { position: relative; }
</style>
</head>
<body>
<div class="bar">
  <span class="title">Birch — новое меню</span>
  <button type="button" class="tab is-on" data-view="desktop">Десктоп</button>
  <button type="button" class="tab" data-view="mobile">Мобилка</button>
  <span class="theme-tabs" id="theme-tabs">
    <button type="button" class="tab tab--sm is-on" data-th="dark">тёмная</button>
    <button type="button" class="tab tab--sm" data-th="light">светлая</button>
  </span>
  <span class="hint" id="hint">всё живое — ховеры, клики и скролл работают</span>
</div>

<div class="view view--desktop is-on" id="view-desktop">
  <iframe id="dd" src="menu.html?panel=min"></iframe>
</div>

<div class="view view--mobile" id="view-mobile">
  <div class="ph"><span class="lbl">dark</span>
    <iframe id="md" src="menu.html?open=1&panel=min"></iframe>
  </div>
  <div class="ph"><span class="lbl">light</span>
    <iframe id="ml" src="menu.html?open=1&panel=min&theme=light"></iframe>
  </div>
</div>

<script>
/* view tabs */
document.querySelectorAll('.tab[data-view]').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab[data-view]').forEach(function (x) { x.classList.toggle('is-on', x === t); });
    var desktop = t.getAttribute('data-view') === 'desktop';
    document.getElementById('view-desktop').classList.toggle('is-on', desktop);
    document.getElementById('view-mobile').classList.toggle('is-on', !desktop);
    /* theme switch only applies to the desktop view (mobile shows both) */
    document.getElementById('theme-tabs').style.visibility = desktop ? 'visible' : 'hidden';
    document.getElementById('hint').textContent = desktop
      ? 'всё живое — ховеры, клики и скролл работают'
      : 'слева тёмная тема, справа светлая; меню открыто, всё кликабельно';
  });
});

/* theme tabs drive the single desktop frame (background page follows) */
document.querySelectorAll('.tab[data-th]').forEach(function (t) {
  t.addEventListener('click', function () {
    document.querySelectorAll('.tab[data-th]').forEach(function (x) { x.classList.toggle('is-on', x === t); });
    document.getElementById('dd').contentWindow.postMessage(
      { type: 'nav2-theme', light: t.getAttribute('data-th') === 'light' }, '*');
  });
});
</script>
</body>
</html>
