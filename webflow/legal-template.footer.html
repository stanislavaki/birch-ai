<script>
/* Keep the document tab highlighted on dated versions.

   Webflow adds .w--current only when a link's href matches the page URL
   exactly. A dated version lives at the document's URL plus "-<date>", so on
   /legal/cookies-2024-10-15 no tab lights up at all and the row reads as
   broken rather than as "you are inside Cookie Policy".

   The site navigation solves the same problem with data-match-prefix, but that
   handler ships inside the navigation component and only looks at nav links,
   so it cannot be reused here.

   Prefix is derived from the href rather than hardcoded, so renaming a
   document's slug needs no change here. The separator is "-" specifically:
   matching on the bare prefix would also light up a sibling whose slug starts
   with the same letters. No two legal slugs collide under this rule today, and
   the "-" keeps that true if one is added later. */
(function () {
  function markCurrentTab() {
    var path = location.pathname.replace(/\/+$/, '');
    var tabs = document.querySelectorAll('.legal-menu-link');

    for (var i = 0; i < tabs.length; i++) {
      var href = (tabs[i].getAttribute('href') || '').replace(/\/+$/, '');
      var isCurrent = !!href && (path === href || path.indexOf(href + '-') === 0);

      tabs[i].classList.toggle('w--current', isCurrent);
      if (isCurrent) {
        tabs[i].setAttribute('aria-current', 'page');
      } else {
        tabs[i].removeAttribute('aria-current');
      }
    }
  }

  /* Must run through Webflow's own queue, not on DOMContentLoaded.

     Webflow's links module re-evaluates every link on ready: it adds
     .w--current to the ones whose href matches the page exactly and REMOVES it
     from all the others. A class set before that runs is silently wiped — the
     first version of this script did exactly that and looked like a no-op while
     the same code worked when pasted into the console.

     Webflow.push queues a callback that fires after the modules have
     initialised, so the mark is applied last and survives. */
  window.Webflow = window.Webflow || [];
  window.Webflow.push(markCurrentTab);
})();
</script>

<script>
/* Keep every dated version out of search results.

   Only the five stable addresses — /legal/terms and friends — should be
   indexable. Every other page this template serves is a specific version and
   duplicates the text of one of them: the version currently in force says the
   same thing as the stable address, and archived or upcoming ones must not
   surface for a query like "birch terms" at all.

   The test is the URL, not a CMS field. A version's slug is always the
   document's slug plus "-YYYY-MM-DD", and a stable address never carries that
   suffix, so the page can tell what it is without any binding. Two earlier
   attempts failed: an attribute bound to the Status field is rejected by the
   API ("value must be a string or a binding"), and hanging the rule on the
   archive notice missed the dated version that IS in force — it shows no
   notice, so it stayed indexable.

   A robots meta only counts in <head>, which is why it is written there.
   Google evaluates it after rendering. */
(function () {
  if (!/-\d{4}-\d{2}-\d{2}$/.test(location.pathname.replace(/\/+$/, ''))) return;

  var m = document.createElement('meta');
  m.setAttribute('name', 'robots');
  m.setAttribute('content', 'noindex, follow');
  document.head.appendChild(m);
})();
</script>

<script>
/* Take the applicability clause out of the heading outline.

   The clause is tagged h6 in the CMS because that is the only block type a
   content editor can choose there, and these documents use no real sixth-level
   heading. Left as an h6 it would sit in the document outline as a
   sentence-long heading, two levels below its neighbours — a skipped level that
   screen readers announce as a heading and that no reader means.

   So the tag is rewritten to a paragraph carrying the same style. If this never
   runs, the clause is still visible and still grey; only the outline suffers.
   That is the safe direction for the failure to go. */
(function () {
  function unheadClause() {
    var body = document.querySelector('.rt-legal');
    if (!body) return;

    body.querySelectorAll('h6').forEach(function (h) {
      var p = document.createElement('p');
      p.className = 'legal-applies-note';
      p.innerHTML = h.innerHTML;
      h.replaceWith(p);
    });
  }

  window.Webflow = window.Webflow || [];
  window.Webflow.push(unheadClause);
})();
</script>
<script>
/* Bring the current document's tab into view on mobile.

   The tab row scrolls sideways below 768px: five tabs measure 771px against a
   375px screen. It always starts at scrollLeft 0, so opening Data Processing or
   Affiliate Program on a phone showed a row with no tab highlighted anywhere in
   sight — the reader cannot tell which document they are in, and the row reads
   as decoration rather than navigation.

   Deliberately NOT in Webflow.push, and deliberately not scrollIntoView:

   - the ready queue fires after the row has painted, so the strip would visibly
     slide from 0 to its target; running here, at the end of <body>, the tabs are
     already parsed and the position is set before first paint;
   - scrollIntoView walks up the ancestor chain and would scroll the PAGE as well,
     dropping the reader below the heading.

   Current tab is matched the same way as in the highlighting script above, by
   href prefix, because .w--current is not on the element yet at this point on a
   dated version — the server only sets it on an exact URL match. */
(function () {
  function place() {
    var strip = document.querySelector('.tabs-cont');
    if (!strip) return;
    if (strip.scrollWidth <= strip.clientWidth) return;

    var path = location.pathname.replace(/\/+$/, '');
    var tabs = strip.querySelectorAll('.legal-menu-link');

    for (var i = 0; i < tabs.length; i++) {
      var href = (tabs[i].getAttribute('href') || '').replace(/\/+$/, '');
      if (!href || (path !== href && path.indexOf(href + '-') !== 0)) continue;

      var centred = tabs[i].offsetLeft - (strip.clientWidth - tabs[i].offsetWidth) / 2;
      var max = strip.scrollWidth - strip.clientWidth;
      strip.scrollLeft = Math.max(0, Math.min(centred, max));
      return;
    }
  }

  place();

  /* Run again once the web font is in. The row is first laid out in the Arial
     fallback, where the five labels together are 41px wider than in TT Commons
     Pro; positioning from those metrics lands the active tab about 20px off.
     The second pass rides along with the reflow the font swap causes anyway, so
     it adds no jump of its own. Same reason as the fonts.ready rule in
     CLAUDE.md for anything that measures rendered text. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(place);
  }
})();
</script>

<script>
/* Give the effective date a machine-readable form.

   The lawyers' original brief asked for the date to be readable programmatically,
   because the frontend stores it alongside the user's consent at registration.
   That path goes through the CMS API and works. What the PAGE exposed, though,
   was nothing structured at all: no <time>, no ISO value anywhere in the markup.

   The native route is closed. A date field can be bound to an element's text but
   not to a `datetime` attribute: Webflow rejects it with "datetime is a reserved
   attribute name". So the element stays as it is and the TEXT inside it gets
   wrapped, which also avoids a layout question — turning the div itself into a
   <time> would make it inline inside .w-dyn-item, which is a block.

   Both rendered formats are accepted on purpose: the binding currently emits
   "September 28, 2026" and is due to be switched to "28 September 2026" in the
   Designer. Parsing both means the switch needs no change here.

   Fails safe: if nothing matches, the visible date is left exactly as it was. */
(function () {
  var MONTHS = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,
                august:8,september:9,october:10,november:11,december:12};

  function iso(text) {
    var t = text.trim().replace(/,/g, ' ').replace(/\s+/g, ' ');
    var m = /^([A-Za-z]+) (\d{1,2}) (\d{4})$/.exec(t);          /* September 28 2026 */
    if (!m) {
      m = /^(\d{1,2}) ([A-Za-z]+) (\d{4})$/.exec(t);            /* 28 September 2026 */
      if (m) m = [m[0], m[2], m[1], m[3]];
    }
    if (!m) return null;
    var mo = MONTHS[m[1].toLowerCase()];
    if (!mo) return null;
    return m[3] + '-' + String(mo).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
  }

  function markUp() {
    /* Three places render the date, not two — found the hard way on 25.09.2026,
       when a format change landed on the pointer pages and missed the dated ones.

       - `.legal-ver-toggle .w-dyn-item > div`  pointer page: a one-item Collection
         List fetches the in-force version's date;
       - `.legal-ver-item > div`                a row of the dropdown;
       - `.legal-ver-toggle > div`              dated page: bound straight to the
         current item, shown by a condition on Status.

       The third selector has to exclude two siblings that are also direct div
       children of the toggle: the arrow, and the Collection List above — wrapping
       the list's whole textContent would flatten the markup inside it. */
    var els = document.querySelectorAll(
      '.legal-ver-toggle .w-dyn-item > div, .legal-ver-item > div, ' +
      '.legal-ver-toggle > div:not(.legal-ver-arrow):not(.w-dyn-list)');

    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.querySelector('time')) continue;                    /* already done */
      var value = iso(el.textContent);
      if (!value) continue;

      var t = document.createElement('time');
      t.setAttribute('datetime', value);
      t.textContent = el.textContent.trim();
      el.textContent = '';
      el.appendChild(t);
    }
  }

  window.Webflow = window.Webflow || [];
  window.Webflow.push(markUp);
})();
</script>
