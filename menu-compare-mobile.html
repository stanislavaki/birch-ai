<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile menu — sheet background experiments</title>
<style>
/* Two mobile frames side by side: dark theme left, light right, menu opened.
   The selector on top switches the sheet-background experiment in both. */
* { box-sizing: border-box; }
body { margin: 0; background: #000; font-family: Arial, sans-serif; }
.bar {
  height: 2.5rem;
  display: flex; align-items: center; gap: 1rem;
  padding: 0 1rem;
  color: #fff; font-size: 0.85rem;
  background: #111; border-bottom: 1px solid #2a2a2a;
}
.bar select { font: inherit; background: #1c1c1c; color: #fff; border: 1px solid #444; border-radius: 0.4rem; padding: 0.15rem 0.3rem; }
.cols { display: flex; justify-content: center; gap: 1rem; padding: 1rem; height: calc(100vh - 2.5rem); }
.ph { position: relative; }
.ph iframe { width: 390px; height: 100%; border: 1px solid #333; border-radius: 0.75rem; background: #111; }
.ph .lbl {
  position: absolute; top: -0.1rem; left: 50%; translate: -50% -100%;
  color: #9f9; font-size: 0.75rem; padding: 0.2rem 0;
}
</style>
</head>
<body>
<div class="bar">
  <label>фон шита:
    <select id="variant">
      <option value="">как сейчас — сплошной #292929</option>
      <option value="glass" selected>стекло — тёмное 75% + blur 15</option>
      <option value="glass2">стекло глубже — 55% + blur 28</option>
      <option value="theme">в цвет темы — светлый шит на светлой</option>
    </select>
  </label>
  <span>слева тёмная тема, справа светлая; меню открыто</span>
</div>
<div class="cols">
  <div class="ph"><span class="lbl">dark</span><iframe id="fd"></iframe></div>
  <div class="ph"><span class="lbl">light</span><iframe id="fl"></iframe></div>
</div>
<script>
function load() {
  var v = document.getElementById('variant').value;
  var sheet = v ? '&sheet=' + v : '';
  document.getElementById('fd').src = 'menu.html?open=1&nopanel=1' + sheet;
  document.getElementById('fl').src = 'menu.html?open=1&nopanel=1&theme=light' + sheet;
}
document.getElementById('variant').addEventListener('change', load);
load();
</script>
</body>
</html>
