<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Icons — Debug</title>
<link rel="stylesheet" href="../design-system/tokens.css" />
<link rel="stylesheet" href="panel.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); font-family: var(--font); -webkit-font-smoothing: antialiased; }

  .preview {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10rem;
    min-height: 100svh;
  }
  .preview__item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }
  .preview__label {
    font: 11px/1 monospace;
    color: #555;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── Icons — sized via --ps, no animation declarations (JS drives) ── */
  .icon-wrap { --ps: 5rem; }

  .hero__deco-cols {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    font-size: var(--ps);
    width:  1.596em;
    height: 1.462em;
  }
  .hero__col {
    position: absolute;
    bottom: 0;
    width:         0.769em;
    border-radius: 0.199em;
  }
  .hero__col--purple { left: 0;       background: var(--color-accent-purple); }
  .hero__col--blue   { left: 0.827em; background: var(--color-accent-blue);   }

  .hero__deco-bars {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.058em;
    flex-shrink: 0;
    font-size: var(--ps);
    width:  1.654em;
    height: 1.462em;
  }
  .hero__bar {
    height: 0.449em;
    border-radius: var(--radius-pill);
  }
  .hero__bar--lb   { background: var(--color-accent-light-blue); }
  .hero__bar--pink { background: var(--color-accent-pink); width: 67.4%; }
  .hero__bar--red  { background: var(--color-accent-red);  }
</style>
</head>
<body>

<div class="preview">
  <div class="preview__item">
    <div class="icon-wrap">
      <div class="hero__deco-cols" aria-hidden="true">
        <div class="hero__col hero__col--purple" id="colPurple"></div>
        <div class="hero__col hero__col--blue"   id="colBlue"></div>
      </div>
    </div>
    <span class="preview__label">cols</span>
  </div>

  <div class="preview__item">
    <div class="icon-wrap">
      <div class="hero__deco-bars" aria-hidden="true">
        <div class="hero__bar hero__bar--lb"   id="barLB"></div>
        <div class="hero__bar hero__bar--pink" id="barPink"></div>
        <div class="hero__bar hero__bar--red"  id="barRed"></div>
      </div>
    </div>
    <span class="preview__label">bars</span>
  </div>
</div>

<script src="panel.js"></script>
<script>
  /* ── Elements ── */
  var colPurple = document.getElementById('colPurple');
  var colBlue   = document.getElementById('colBlue');
  var barLB     = document.getElementById('barLB');
  var barPink   = document.getElementById('barPink');
  var barRed    = document.getElementById('barRed');

  /* ── Configs — separate per icon group ── */
  window.CC = { dur: 1050, pause: 1025, stagger: 105, ease: [0.85, 0.01, 0.55, 1] };  /* Cols  */
  window.CB = { dur: 1150, pause: 775,  stagger: 135, pinkMid: 91, ease: [0.88, -0.03, 0.43, 1.07] };  /* Bars  */

  /* ── Bezier solver ── */
  function makeBezier(x1, y1, x2, y2) {
    return function(p) {
      if (p <= 0) return 0; if (p >= 1) return 1;
      var t = p, lo = 0, hi = 1;
      for (var i = 0; i < 14; i++) {
        var bx = 3*(1-t)*(1-t)*t*x1 + 3*(1-t)*t*t*x2 + t*t*t;
        if (Math.abs(bx - p) < 0.0001) break;
        if (bx < p) lo = t; else hi = t;
        t = (lo + hi) / 2;
      }
      return 3*(1-t)*(1-t)*t*y1 + 3*(1-t)*t*t*y2 + t*t*t;
    };
  }

  /* Cached bezier per key */
  var _bc = {};
  function getBez(key, e) {
    var k = e.join(',');
    if (!_bc[key] || _bc[key].k !== k) _bc[key] = { k: k, fn: makeBezier(e[0],e[1],e[2],e[3]) };
    return _bc[key].fn;
  }

  /* ── Phase helpers ── */

  /* Raw triangular wave 0→1→0 with pause at extremes, no ease */
  function rawPhase(now, offset, C) {
    var half = C.dur + C.pause;
    var t = (((now - offset) % (2*half)) + 2*half) % (2*half) / half;
    var tLin = t < 1 ? t : 2 - t;
    var p = (C.pause / 2) / half;
    if (tLin <= p) return 0;
    if (tLin >= 1 - p) return 1;
    return (tLin - p) / (1 - 2*p);
  }

  /* Raw tLin (0→1→0, no pause mapping) — for cycle detection */
  function rawTLin(now, offset, C) {
    var half = C.dur + C.pause;
    var t = (((now - offset) % (2*half)) + 2*half) % (2*half) / half;
    return t < 1 ? t : 2 - t;
  }

  /* Lerp */
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* Piecewise 3-keyframe: ease applied per segment (matches CSS per-keyframe timing) */
  function pw3(t, ez, v0, vm, v1) {
    if (t < 0.5) return lerp(v0, vm, ez(t * 2));
    return lerp(vm, v1, ez((t - 0.5) * 2));
  }

  /* ── Independent random heights — each column picks its own target on descent ── */
  var _colMinP = 39, _colMinB = 39;
  var _colLastTLinP = 0, _colLastTLinB = 0;

  /* ── Tick ── */
  function tick(now) {
    var eC = getBez('cols', CC.ease);
    var eB = getBez('bars', CB.ease);

    /* — Cols — */
    var tP = rawPhase(now, 0,          CC);
    var tB = rawPhase(now, CC.stagger, CC);

    /* Each column picks a new random height (20–80) at the moment it starts descending.
       Purple descends on backward phase → update when leaving top pause.
       Blue descends on forward phase → update when leaving bottom pause. */
    var tLinP = rawTLin(now,           0,          CC);
    var tLinB = rawTLin(now,           CC.stagger, CC);
    var topP  = 1 - (CC.pause / 2) / (CC.dur + CC.pause);
    var botP  =     (CC.pause / 2) / (CC.dur + CC.pause);

    if (_colLastTLinP >= topP && tLinP < topP) {
      _colMinP = Math.round(20 + Math.random() * 70);
    }
    if (_colLastTLinB <= botP && tLinB > botP) {
      _colMinB = Math.round(20 + Math.random() * 70);
    }
    _colLastTLinP = tLinP;
    _colLastTLinB = tLinB;

    colPurple.style.height = lerp(_colMinP, 100,     eC(tP)) + '%';
    colBlue.style.height   = lerp(100,     _colMinB, eC(tB)) + '%';
    window._dbgP_cols = tP;

    /* — Bars — */
    var tLB   = rawPhase(now, 0,             CB);
    var tPink = rawPhase(now, CB.stagger,     CB);
    var tRed  = rawPhase(now, CB.stagger * 2, CB);

    barLB.style.width        = pw3(tLB,   eB, 100,  67.4, 34.9)       + '%';
    barLB.style.marginLeft   = pw3(tLB,   eB, 0,    16.3, 0)          + '%';
    barPink.style.width      = pw3(tPink, eB, 67.4, CB.pinkMid, 67.4) + '%';
    barPink.style.marginLeft = pw3(tPink, eB, 0,    16.3, 0)          + '%';
    barRed.style.width       = pw3(tRed,  eB, 34.9, 67.4, 100)        + '%';
    barRed.style.marginLeft  = pw3(tRed,  eB, 0,    16.3, 0)          + '%';
    window._dbgP_bars = tLB;
  }

  /* ── rAF loop ── */
  (function loop() {
    tick(performance.now());
    requestAnimationFrame(loop);
  })();

  /* ── DebugPanel ── */
  function makeTrack(key, label, color, C, bezKey) {
    return {
      key: key, label: label, color: color,
      getS: function() { return 0; }, setS: function() {},
      getE: function() { return 1; }, setE: function() {},
      ease:    function() { return C.ease; },
      setEase: function(e) { C.ease = e; },
      inP:     function(p) { return getBez(bezKey, C.ease)(p); },
      readonlyS: true, readonlyE: true, hintS: 'fixed', hintE: 'fixed',
    };
  }

  function makeSliders(C) {
    var sliders = [
      { label: 'Duration', get: function() { return C.dur; },     set: function(v) { C.dur = v; },
        min: 400, max: 5000, step: 50, fmt: function(v) { return v + 'ms'; } },
      { label: 'Pause',    get: function() { return C.pause; },   set: function(v) { C.pause = v; },
        min: 0, max: 2000, step: 25, fmt: function(v) { return v + 'ms'; } },
      { label: 'Stagger',  get: function() { return C.stagger; }, set: function(v) { C.stagger = v; },
        min: 0, max: 500, step: 5, fmt: function(v) { return v + 'ms'; } },
    ];
    if ('pinkMid' in C) {
      sliders.push({ label: 'Pink mid', get: function() { return C.pinkMid; }, set: function(v) { C.pinkMid = v; },
        min: 20, max: 100, step: 1, fmt: function(v) { return v + '%'; } });
    }
    return sliders;
  }

  function copyValues(C) {
    var lines = [
      'duration:  ' + C.dur + 'ms',
      'pause:     ' + C.pause + 'ms',
      'stagger:   ' + C.stagger + 'ms',
      'ease:      cubic-bezier(' + C.ease.join(', ') + ')',
    ];
    if ('pinkMid' in C) lines.push('pink mid:  ' + C.pinkMid + '%');
    return lines.join('\n');
  }

  DebugPanel.init({
    blocks: [
      {
        label:  'Cols',
        getP:   function() { return window._dbgP_cols || 0; },
        pRange: [0, 1],
        tracks:  [ makeTrack('ease', 'Ease', '#B983FF', CC, 'cols') ],
        sliders: makeSliders(CC),
        onCopy:  function() { return copyValues(CC); },
      },
      {
        label:  'Bars',
        getP:   function() { return window._dbgP_bars || 0; },
        pRange: [0, 1],
        tracks:  [ makeTrack('ease', 'Ease', '#59DBFF', CB, 'bars') ],
        sliders: makeSliders(CB),
        onCopy:  function() { return copyValues(CB); },
      },
    ],
  });

  document.getElementById('dbg').classList.add('collapsed');
</script>
</body>
</html>
