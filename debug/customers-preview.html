    root.setAttribute('data-ready', '');
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        root.toggleAttribute('data-paused', !entries[0].isIntersecting);
      }).observe(root);
    }
  });
})();
</script>
