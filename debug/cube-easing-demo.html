<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cube easing — comparison</title>
<link rel="stylesheet" href="../design-system/tokens.css" />
<style>
  body {
    background: #0D0D12; color: #fff; font-family: var(--font);
    margin: 0; padding: 3rem 2.5rem 6rem;
  }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
  .sub { color: #7a7a7a; font-size: 0.85rem; margin: 0 0 2.5rem; }

  .row {
    display: grid;
    grid-template-columns: 13rem auto;
    align-items: center;
    gap: 2rem;
    padding: 1.1rem 0;
    border-top: 1px solid #1c1c26;
  }
  .meta .name { font-size: 1rem; font-weight: 600; }
  .meta .spec { font-size: 0.78rem; color: #7a7a7a; font-family: monospace; margin-top: 0.2rem; }

  /* ── cube pill (mirrors birch-mcp hero) ── */
  .swap {
    --ps: 2.75rem;                 /* 44px — a touch smaller than hero so 6 rows fit */
    --r: 0.656em;
    font-size: var(--ps);
    position: relative;
    display: inline-block;
    height: 1.312em;
    perspective: 16em;
  }
  .cube {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform: translateZ(calc(-1 * var(--r))) rotateX(var(--turn, 0deg));
    /* transition set per-row inline via --dur / --ease */
    transition: transform var(--dur, 0.45s) var(--ease, ease);
  }
  .pill {
    position: absolute; left: 0; top: 0; width: 100%;
    display: flex; align-items: center; justify-content: flex-start;
    box-sizing: border-box;
    padding: 0.058em 0.462em 0.154em;
    font-weight: 600; line-height: 1.1; letter-spacing: -0.02em;
    white-space: nowrap; color: #000;
    border-radius: 0.308em;
    backface-visibility: hidden;
  }
  .pill:nth-child(1) { transform: rotateX(0deg)   translateZ(var(--r)); background: #F47850; }
  .pill:nth-child(2) { transform: rotateX(90deg)  translateZ(var(--r)); background: var(--color-accent-purple);     color: #fff; }
  .pill:nth-child(3) { transform: rotateX(180deg) translateZ(var(--r)); background: var(--color-accent-light-blue); }
  .pill:nth-child(4) { transform: rotateX(270deg) translateZ(var(--r)); background: var(--color-accent-pink);       color: #fff; }

  .hint { margin-top: 2.5rem; color: #6a6a6a; font-size: 0.8rem; }
  .hint b { color: #9a9a9a; font-weight: 600; }
</style>
</head>
<body>
  <h1>Cube easing — comparison</h1>
  <p class="sub">Each cube auto-turns on its own timing so you can feel the difference. Hover any cube to flick it manually.</p>

  <div id="rows"></div>

  <p class="hint">Pick one by number — I'll wire the chosen <b>duration + easing</b> into the hero, and we can tune the <b>hold</b> (pause between turns) separately.</p>

<script>
(function () {
  var FACES = ['Claude', 'Chat GPT', 'Perplexity', 'your AI tool'];
  var HOLD  = 1500;   /* short pause here just so the comparison reads quickly */

  var VARIANTS = [
    { name: '1 · Current',      dur: 450, ease: 'cubic-bezier(0.65, 0, 0.35, 1)' },
    { name: '2 · Snappy',       dur: 380, ease: 'cubic-bezier(0.7, 0, 0.3, 1)' },
    { name: '3 · Spring',       dur: 520, ease: 'cubic-bezier(0.34, 1.56, 0.64, 1)' },
    { name: '4 · Fast-out',     dur: 460, ease: 'cubic-bezier(0.16, 1, 0.3, 1)' },
    { name: '5 · Weighted',     dur: 600, ease: 'cubic-bezier(0.83, 0, 0.17, 1)' },
    { name: '6 · Anticipation', dur: 560, ease: 'cubic-bezier(0.68, -0.55, 0.27, 1.55)' }
  ];

  var rows = document.getElementById('rows');

  VARIANTS.forEach(function (v) {
    var row = document.createElement('div');
    row.className = 'row';

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = '<div class="name">' + v.name + '</div>' +
                     '<div class="spec">' + v.dur + 'ms · ' + v.ease.replace('cubic-bezier', 'cb') + '</div>';

    var swap = document.createElement('span');
    swap.className = 'swap';
    var cube = document.createElement('span');
    cube.className = 'cube';
    cube.style.setProperty('--dur', (v.dur / 1000) + 's');
    cube.style.setProperty('--ease', v.ease);
    FACES.forEach(function (t) {
      var p = document.createElement('span');
      p.className = 'pill';
      p.textContent = t;
      cube.appendChild(p);
    });
    swap.appendChild(cube);

    row.appendChild(meta);
    row.appendChild(swap);
    rows.appendChild(row);

    var turns = 0, timer = null;
    function step() {
      turns += 1;
      cube.style.setProperty('--turn', (-turns * 90) + 'deg');
      timer = setTimeout(step, HOLD);
    }
    swap.addEventListener('mouseenter', function () {
      if (timer) clearTimeout(timer);
      step();
    });
    timer = setTimeout(step, HOLD);
  });
})();
</script>
</body>
</html>
