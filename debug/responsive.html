<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Responsive check</title>
<style>
  /* Dev-only viewer: each frame gets a real viewport width, so the page's
     own media queries fire. Frames are scaled down to fit side by side. */
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 0.8125rem/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 1rem; align-items: center; padding: 0.75rem 1rem; }
  header input { flex: 1; background: #222; color: #eee; border: 0.0625rem solid #333; border-radius: 0.375rem; padding: 0.375rem 0.5rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start; padding: 0 1rem 2rem; }
  figure { margin: 0; flex: none; }
  figcaption { margin-bottom: 0.375rem; opacity: 0.7; }
  .viewport { overflow: hidden; border-radius: 0.5rem; background: #000; }
  iframe { border: 0; transform-origin: 0 0; display: block; }
</style>
</head>
<body>
<header>
  <span>Page</span>
  <input id="src" value="../home-slides.html">
  <span>scroll inside each frame</span>
</header>
<div class="row" id="row"></div>
<script>
  // width x height of the emulated viewport, and the scale it is shown at
  const FRAMES = [
    { name: 'Desktop 1440', w: 1440, h: 900, s: 0.45 },
    { name: 'Tablet 820', w: 820, h: 1180, s: 0.45 },
    { name: 'Mobile 390', w: 390, h: 844, s: 0.7 },
  ];
  const row = document.getElementById('row');
  const input = document.getElementById('src');
  function render() {
    row.innerHTML = '';
    FRAMES.forEach(f => {
      const fig = document.createElement('figure');
      fig.innerHTML = `<figcaption>${f.name}</figcaption>`;
      const box = document.createElement('div');
      box.className = 'viewport';
      box.style.width = f.w * f.s + 'px';
      box.style.height = f.h * f.s + 'px';
      const ifr = document.createElement('iframe');
      ifr.src = input.value;
      ifr.width = f.w; ifr.height = f.h;
      ifr.style.transform = `scale(${f.s})`;
      box.appendChild(ifr); fig.appendChild(box); row.appendChild(fig);
    });
  }
  input.addEventListener('change', render);
  render();
</script>
</body>
</html>
