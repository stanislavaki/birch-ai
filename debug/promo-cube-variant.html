<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MCP destination — drum vs 3D cube</title>
<link rel="stylesheet" href="../design-system/tokens.css" />
<style>
  body { background: var(--color-accent-purple); color: #fff; font-family: var(--font); margin: 0; padding: 4rem 2rem; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
  .sub { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin: 0 0 3rem; }
  .row { display: flex; gap: 5rem; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  .col h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .col p  { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin: 0; max-width: 15rem; text-align: center; }

  /* shared tile size */
  .tile { width: 9rem; aspect-ratio: 1; container-type: inline-size; }

  /* ─── Variant A — DRUM: static white tile, the logo flips inside ─── */
  .drum {
    position: relative; width: 100%; height: 100%;
    background: #fff; border-radius: 26%;
    box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
    perspective: 45cqw;
  }
  .drum__cube {
    position: absolute; inset: 20%;
    transform-style: preserve-3d;
    --r: 7.5cqw;
    transform: translateZ(calc(-1 * var(--r))) rotateX(var(--turn, 0deg));
    transition: transform 0.6s cubic-bezier(0.83, 0, 0.17, 1);
  }
  .drum__face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; }
  .drum__face img, .drum__face i { width: 100%; height: 100%; object-fit: contain; }
  .drum__face:nth-child(1) { transform: rotateX(0deg)   translateZ(var(--r)); }
  .drum__face:nth-child(2) { transform: rotateX(90deg)  translateZ(var(--r)); }
  .drum__face:nth-child(3) { transform: rotateX(180deg) translateZ(var(--r)); }
  .drum__face:nth-child(4) { transform: rotateX(270deg) translateZ(var(--r)); }

  /* ─── Variant B — 3D CUBE: the whole tile is a box that tumbles ─── */
  .cube3d { position: relative; width: 100%; height: 100%; perspective: 120cqw; }
  .cube3d__box {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    --r: 50cqw;                       /* half the tile — a full cube */
    transform: rotateX(var(--turn, 0deg));
    transition: transform 0.7s cubic-bezier(0.83, 0, 0.17, 1);
  }
  .cube3d__face {
    position: absolute; inset: 0;
    background: #fff; border-radius: 20%;
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 0.4cqw rgba(0,0,0,0.04);
  }
  .cube3d__face img, .cube3d__face i { width: 56%; height: 56%; object-fit: contain; }
  .cube3d__face:nth-child(1) { transform: rotateX(0deg)   translateZ(var(--r)); }
  .cube3d__face:nth-child(2) { transform: rotateX(90deg)  translateZ(var(--r)); }
  .cube3d__face:nth-child(3) { transform: rotateX(180deg) translateZ(var(--r)); }
  .cube3d__face:nth-child(4) { transform: rotateX(270deg) translateZ(var(--r)); }

  /* masked (dark) ChatGPT so it reads on white */
  .face--gpt { background: #111 !important; -webkit-mask: none; }
  .face--gpt-mark {
    width: 56%; height: 56%; background: #fff;
    -webkit-mask: var(--icon) center/contain no-repeat;
            mask: var(--icon) center/contain no-repeat;
  }
  .drum__face.face--gpt, .cube3d__face.face--gpt { background: #fff !important; }
  .drum__face .face--gpt-mark, .cube3d__face .face--gpt-mark { background: #111; }
</style>
</head>
<body>
  <h1>MCP destination — drum vs 3D cube</h1>
  <p class="sub">Both cycle Claude &rarr; ChatGPT &rarr; Perplexity &rarr; Codex. Pick the feel you want.</p>

  <div class="row">
    <div class="col">
      <div class="tile">
        <div class="drum">
          <div class="drum__cube" data-cube>
            <div class="drum__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d29c7446ada92191091_claude.svg"></div>
            <div class="drum__face face--gpt"><i class="face--gpt-mark" style="--icon:url('https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625ca32ab14fc409c60353_chat-gpt-white.svg')"></i></div>
            <div class="drum__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d29d43e976365befb20_perplexity.svg"></div>
            <div class="drum__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d298be57d9e64b13bb3_codex.svg"></div>
          </div>
        </div>
      </div>
      <h2>A &middot; Drum (current)</h2>
      <p>Flat front face, no visible depth &mdash; the logo just flips.</p>
    </div>

    <div class="col">
      <div class="tile">
        <div class="cube3d">
          <div class="cube3d__box" data-cube>
            <div class="cube3d__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d29c7446ada92191091_claude.svg"></div>
            <div class="cube3d__face face--gpt"><i class="face--gpt-mark" style="--icon:url('https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625ca32ab14fc409c60353_chat-gpt-white.svg')"></i></div>
            <div class="cube3d__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d29d43e976365befb20_perplexity.svg"></div>
            <div class="cube3d__face"><img src="https://cdn.prod.website-files.com/6716718ea408f53194adf9a9/6a625d298be57d9e64b13bb3_codex.svg"></div>
          </div>
        </div>
      </div>
      <h2>B &middot; 3D cube (tumbling tile)</h2>
      <p>The whole tile is a box that visibly tumbles in perspective.</p>
    </div>
  </div>

<script>
(function () {
  var HOLD = 1700;
  [].slice.call(document.querySelectorAll('[data-cube]')).forEach(function (cube) {
    var turns = 0;
    setInterval(function () {
      turns += 1;
      cube.style.setProperty('--turn', (-turns * 90) + 'deg');
    }, HOLD);
  });
})();
</script>
</body>
</html>
