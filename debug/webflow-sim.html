<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webflow Simulator</title>
  <style>
    @font-face {
      font-family: "Tt Commons Pro Variable";
      src: url("../fonts/TT_Commons_Pro_Variable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }

    /* ── Webflow fluid font-size (from .fluid-css.w-embed, reused on all pages) ── */
    html { font-size: 16px; }
    @media (min-width: 768px)  { html { font-size: calc(12.5px + 3.5 * ((100vw - 768px) / 223)); } }
    @media (min-width: 992px)  { html { font-size: calc(12.67px + 3.33 * ((100vw - 992px) / 288)); } }
    @media (min-width: 1280px) { html { font-size: calc(16px + 5.33 * ((100vw - 1280px) / 320)); } }
    @media (min-width: 1600px) { html { font-size: 21.33px; } }

    /* ── Webflow global resets (from real site) ── */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Tt Commons Pro Variable", Arial, sans-serif;
      background: #0D0D12;
    }
    .container { max-width: 75rem; margin: 0 auto; }
    img { border-radius: 8px; }

    /* ── nav-height CSS var (как в реальном Webflow) ── */
    :root { --nav-height: 6.5em; }

    /* ── Simulated fixed navbar (matches real bir.ch nav structure) ── */
    .sim-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-height);
      background: transparent;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      z-index: 1000;
      color: #fff;
      font-family: "Tt Commons Pro Variable", Arial, sans-serif;
    }
    .sim-nav__inner {
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
    }
    .sim-nav__logo {
      display: flex;
      align-items: center;
      height: 2rem;
      flex: none;
      text-decoration: none;
      color: #fff;
    }
    .sim-nav__logo svg { height: 100%; width: auto; }
    .sim-nav__center {
      position: absolute;
      left: 0; right: 0;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .sim-nav__center-links {
      display: flex;
      align-items: center;
      pointer-events: all;
    }
    .sim-nav__link {
      position: relative;
      display: flex;
      align-items: center;
      padding: 1em 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .sim-nav__link:hover { opacity: 0.7; }
    .sim-nav__link-dot {
      position: absolute;
      bottom: 0.3em;
      left: 50%;
      transform: translateX(-50%);
      width: 0.5rem; height: 0.5rem;
      border-radius: 100vw;
      background: #fff;
      opacity: 0;
      transition: opacity 0.35s;
    }
    .sim-nav__link:hover .sim-nav__link-dot { opacity: 1; }
    .sim-nav__badge {
      position: absolute;
      top: 0.3em;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #ffe243;
    }
    .sim-nav__right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0;
    }
    .sim-nav__link-lg {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      border-radius: 0.5rem;
      line-height: 1;
      transition: background-color 0.35s;
    }
    .sim-nav__link-lg:hover { background: #2a2a2a; }
    .sim-nav__btn {
      display: flex;
      align-items: center;
      margin-left: 0.7rem;
      padding: 0.75rem 1.25rem;
      background: #ffe243;
      color: #0b0b0b;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      border-radius: 0.5rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.35s;
    }
    .sim-nav__btn:hover { background: #4551f2; color: #fff; }
    .sim-nav__info {
      margin-left: 1rem;
      color: #555;
      font-size: 0.7rem;
      font-family: monospace;
      flex: none;
    }

    /* ── Webflow global element styles (from real bir.ch site) ── */
    h1 { margin-top: 0; margin-bottom: 20px; font-size: 60px; font-weight: 600; line-height: 1.1em; }
    h2 { font-size: 38px; line-height: 1.2em; font-weight: 700; margin-top: 0; margin-bottom: 18px; }
    h3 { margin-top: 0; margin-bottom: 12px; font-size: 24px; font-weight: 600; line-height: 1.3em; }
    h4 { max-width: 400px; margin-top: 0; margin-bottom: 20px; font-size: 24px; font-weight: 400; line-height: 1.3em; }
    h5 { margin-top: 0; margin-bottom: 10px; font-size: 1.125rem; font-weight: 600; line-height: 1.5em; }
    p  { margin-bottom: 10px; }
    ul { margin-top: 0; margin-bottom: 10px; padding-left: 40px; }
    ol { margin-top: 0; margin-bottom: 10px; padding-left: 40px; }
    li { margin-bottom: 12px; }
    @media (min-width: 1440px) {
      h2 { font-size: 42px; }
    }

    /* ── Webflow .section (from real site) ── */
    .section {
      position: relative;
      display: block;
      padding-top: 5rem;
      padding-bottom: 5rem;
    }

    /* ── Webflow .container (from real site) ── */
    .container {
      display: block;
      width: 100%;
      max-width: 75rem;
      margin-right: auto;
      margin-left: auto;
      padding-right: 1.5rem;
      padding-left: 1.5rem;
      transition: all 525ms ease;
    }
    @media (max-width: 767px) {
      .container {
        padding-right: 1rem;
        padding-left: 1rem;
      }
    }

    /* ── AQ debug panel ── */
    .aq-dbg {
      position: fixed;
      top: 6rem;
      right: 1rem;
      background: rgba(0,0,0,0.88);
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 12px 14px;
      z-index: 3000;
      width: 220px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .aq-dbg__title {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }
    .aq-dbg__row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .aq-dbg__label {
      display: flex;
      justify-content: space-between;
    }
    .aq-dbg__val { color: #59DBFF; }
    .aq-dbg input[type=range] {
      width: 100%;
      accent-color: #59DBFF;
    }
    .aq-dbg__reset {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 4px;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .aq-dbg__reset:hover { background: #333; color: #fff; }

    /* ── Info bar ── */
    .sim-info {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 16px;
      display: flex;
      gap: 2rem;
      z-index: 2000;
    }
  </style>
  <link rel="stylesheet" href="../design-system/tokens.css">
</head>

      <div class="sim-nav__center">
        <div class="sim-nav__center-links">

      <!-- Right nav -->
      <div class="sim-nav__right">

  <!-- Pills embed -->
  <section class="section" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container">
      <div id="simPills"></div>
    </div>
  </section>

  <!-- Accordion embed -->
  <section class="section">
    <div class="container">
      <div id="simAcc"></div>
    </div>
  </section>

  <!-- Prompts embed -->
  <section class="section">
    <div id="simPrompts"></div>
  </section>

  <!-- Vision embed -->
  <section class="section">
    <div class="container">
      <div id="simVision"></div>
    </div>
  </section>

  <!-- Stage HIW embed -->
  <section class="section">
    <div class="container">
      <div id="simStageHiw"></div>
    </div>
  </section>

  <!-- Footer Physics embed -->
  <!-- Spacer for scroll testing -->
  <div style="height: 1200px; background: #0D0D12; display: flex; align-items: center; justify-content: center;">
    <span style="color: #333; font-family: monospace; font-size: 14px;">↕ scroll spacer 1200px</span>
  </div>

  <!-- AQ Text embed -->
  <section class="section">
    <div class="container">
      <div id="simAqText"></div>
    </div>
  </section>

  <!-- Spacer after for scroll testing -->
  <div style="height: 1200px; background: #0D0D12; display: flex; align-items: center; justify-content: center;">
    <span style="color: #333; font-family: monospace; font-size: 14px;">↕ scroll spacer 1200px</span>
  </div>

  <!-- Footer Physics embed -->
  <div style="background:#0D0D12;overflow:hidden;display:block;font-size:0;line-height:0">
    <div id="simFooter"></div>
  </div>

  <!-- Info bar: viewport + font-size -->
  <div class="sim-info">
    <span>viewport: <b id="infoVw">—</b></span>
    <span>html font-size: <b id="infoFs">—</b></span>
    <span>--nav-height: <b id="infoNav">—</b></span>
    <span style="color:#aaa">← симулятор Webflow-окружения</span>
  </div>

  <script>
    function loadEmbed(file, targetId) {
      fetch(file, { cache: 'no-store' })
        .then(function(r) { return r.text(); })
        .then(function(html) {
          html = html
            .replace(/<!DOCTYPE[^>]*>/i, '')
            .replace(/<html[^>]*>/i, '')
            .replace(/<\/html>/i, '')
            .replace(/<head>[\s\S]*?<\/head>/i, '')
            .replace(/<body[^>]*>/i, '')
            .replace(/<\/body>/i, '')
            .trim();
          var target = document.getElementById(targetId);
          target.innerHTML = html;
          target.querySelectorAll('script').forEach(function(s) {
            var newScript = document.createElement('script');
            newScript.textContent = s.textContent;
            document.body.appendChild(newScript);
            s.remove();
          });
        })
        .catch(function(e) {
          document.getElementById(targetId).innerHTML =
            '<p style="color:red;padding:2rem">Ошибка загрузки ' + file + ': ' + e + '</p>';
        });
    }

    loadEmbed('../embed/stage-embed.html', 'simStageHiw');
    loadEmbed('../embed/ai-promo-pills-embed.html', 'simPills');
    loadEmbed('../embed/ai-promo-acc-embed.html',  'simAcc');
    loadEmbed('../embed/ai-promo-prompts-embed.html', 'simPrompts');
    loadEmbed('../embed/ai-promo-vision-embed.html', 'simVision');
    loadEmbed('../embed/aq-text-embed.html?v=' + Date.now(), 'simAqText');
    loadEmbed('../embed/footer-physics-embed.html?v=' + Date.now(), 'simFooter');

    // ── Info bar update ──
    function updateInfo() {
      var fs = parseFloat(getComputedStyle(document.documentElement).fontSize).toFixed(1);
      var nav = getComputedStyle(document.documentElement).getPropertyValue('--nav-height').trim();
      document.getElementById('infoVw').textContent = window.innerWidth + 'px';
      document.getElementById('infoFs').textContent = fs + 'px';
      document.getElementById('infoNav').textContent = nav;
      document.getElementById('simNavInfo').textContent =
        window.innerWidth + 'px · html=' + fs + 'px';
    }
    updateInfo();
    window.addEventListener('resize', updateInfo);

  </script>

</body>
</html>
