<style id="hiw-e-dynamic"></style>
<style>
  /* ── Scoped design tokens ── */
  .hiw-e {
    --hiw-font:         "TT Commons Pro Variable", "Inter", Arial, sans-serif;
    --hiw-color-bg:     #0D0D12;
    --hiw-color-grey:   #2A2A2A;
    --hiw-color-text:   #FFFFFF;
    --hiw-color-muted:  #909090;
    --hiw-radius-xl:    1.5rem;
    --hiw-radius-lg:    1rem;
    --hiw-radius-md:    0.75rem;
    --hiw-radius-pill:  9999px;
    --hiw-pad:          1.5rem;
    --hiw-gap:          1rem;
    --hiw-gap-sm:       0.5rem;
    --hiw-space-xxs:    0.25rem;
    --hiw-space-xs:     0.5rem;
    --hiw-space-sm:     1rem;
    --hiw-space-md:     2rem;
    --hiw-space-lg:     3rem;
  }

  /* ── Typography (scoped to .hiw-e) ── */
  .hiw-e .t-h4 {
    font-family: var(--hiw-font);
    font-size: 1.5rem; font-weight: 600;
    line-height: 1; letter-spacing: 0;
  }
  .hiw-e .t-h5 {
    font-family: var(--hiw-font);
    font-size: 1.2rem; font-weight: 600;
    line-height: 1.4; letter-spacing: 0;
  }
  .hiw-e .t-para-lg {
    font-family: var(--hiw-font);
    font-size: 1.25rem; font-weight: 600;
    line-height: 1.1; letter-spacing: 0;
  }
  .hiw-e .t-body {
    font-family: var(--hiw-font);
    font-size: 0.9rem; font-weight: 600;
    line-height: 1.2; letter-spacing: 0;
  }
  @media (max-width: 991px) {
    .hiw-e .t-h4 { font-size: 1.2rem; line-height: 1.4; }
  }
  @media (max-width: 767px) {
    .hiw-e .t-h5  { font-size: 1.2rem; }
    .hiw-e .t-para-lg { font-size: 1.1rem; }
  }

  /* ── Section ── */
  .hiw-e {
    font-family: var(--hiw-font);
    -webkit-font-smoothing: antialiased;
    box-sizing: border-box;
  }
  .hiw-e *, .hiw-e *::before, .hiw-e *::after { box-sizing: border-box; }
  .hiw-e a { color: inherit; text-decoration: none; }
  .hiw-e button { font: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  .hiw-e img, .hiw-e svg { display: block; max-width: 100%; }

  /* ── Container ── */
  /* font-size: 16px anchors all rem values inside the card to 16px base,
     regardless of what Webflow sets on :root */
  .hiw-e__sticky .hiw-e__container {
    font-size: 16px;
    width: 100%;
    max-width: 100rem;
    margin-inline: auto;
    padding-inline: 1.5rem;
    display: flex;
    align-items: center;
  }
  @media (max-width: 1279px) {
    .hiw-e__sticky .hiw-e__container { padding-inline: 1.25rem; }
  }
  @media (max-width: 991px) {
    .hiw-e__sticky .hiw-e__container { padding-inline: 1rem; }
  }

  /* ── Sticky wrapper ── */
  .hiw-e__sticky {
    position: sticky;
    top: var(--nav-height, 0px);
    height: calc(100vh - var(--nav-height, 0px));
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  /* ── Card ── */
  .hiw-e__card {
    display: flex;
    width: 100%;
    height: clamp(22rem, 80vh, 40rem);
    border-radius: var(--hiw-radius-xl);
    background: var(--hiw-color-grey);
    overflow: hidden;
  }

  /* ── Left: accordion ── */
  .hiw-e__accordion {
    width: 33.33%;
    flex-shrink: 0;
    padding: var(--hiw-pad) !important;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    position: relative;
  }
  @media (max-width: 1279px) { .hiw-e__accordion { width: 41.67%; } }
  @media (max-width: 991px)  { .hiw-e__accordion { width: 33.33%; } }

  .hiw-e__highlight {
    position: absolute;
    left: var(--hiw-pad);
    right: var(--hiw-pad);
    background: var(--hiw-color-bg);
    border-radius: var(--hiw-radius-lg);
    pointer-events: none;
    z-index: 0;
  }

  .hiw-e__step {
    display: flex;
    align-items: flex-start;
    gap: var(--hiw-gap);
    padding: 0.7rem var(--hiw-space-sm) !important;
    border-radius: var(--hiw-radius-lg);
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: var(--hiw-font);
    flex: 0 1 auto;
    min-height: 0;
    position: relative;
    z-index: 1;
  }
  .hiw-e__step.is-active { flex: 1 1 0; min-height: 0; }

  .hiw-e__step-num   { flex-shrink: 0; color: var(--hiw-color-muted); }
  .hiw-e__step.is-active .hiw-e__step-num,
  .hiw-e__step.is-read   .hiw-e__step-num { color: var(--hiw-color-text); }

  .hiw-e__step-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    gap: var(--hiw-gap-sm);
  }

  .hiw-e__step-title { color: var(--hiw-color-muted); margin: 0; }
  .hiw-e__step.is-active .hiw-e__step-title,
  .hiw-e__step.is-read   .hiw-e__step-title { color: var(--hiw-color-text); }

  .hiw-e__step-desc {
    color: var(--hiw-color-text);
    margin: 0;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
  }
  .hiw-e__step.is-active .hiw-e__step-desc {
    max-height: 12rem;
    opacity: 1;
    /* transition injected by applyTransitions() */
  }

  /* ── Right: visual panel ── */
  .hiw-e__visual {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .hiw-e__slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--hiw-space-lg) var(--hiw-pad);
    will-change: transform, opacity;
  }
  .hiw-e__slide picture { display: contents; }
  .hiw-e__slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: var(--hiw-radius-lg);
    display: block;
  }

  .hiw-e__coming-soon {
    position: absolute;
    bottom: var(--hiw-space-xs);
    right: var(--hiw-space-xs);
    display: flex;
    align-items: center;
    gap: var(--hiw-gap-sm);
  }
  .hiw-e__coming-soon-text { color: var(--hiw-color-text); }
  .hiw-e__platform-icons { display: flex; gap: var(--hiw-space-xxs); }
  .hiw-e__platform-icons img {
    width: 2rem; height: 2rem;
    border-radius: var(--hiw-radius-pill);
  }

  /* ── Mobile-only elements (hidden on desktop) ── */
  .hiw-e__mob-text   { display: none; }
  .hiw-e__mob-dots   { display: none; }
  .hiw-e__mob-arrow  { display: none; }

  /* ─────────────────────────────────────────
     MOBILE (≤767px) — horizontal carousel
  ───────────────────────────────────────── */
  @media (max-width: 767px) {

    .hiw-e { height: auto !important; }

    .hiw-e__sticky {
      position: static;
      height: auto;
      overflow: visible;
    }

    .hiw-e__sticky .hiw-e__container {
      flex-direction: column;
      align-items: stretch;
      padding-block: var(--hiw-space-lg);
    }

    .hiw-e__card {
      flex-direction: column;
      align-items: stretch;
      height: auto;
      background: transparent;
      position: relative;
      overflow: hidden;
      transition: background-color 0.5s ease;
    }

    .hiw-e__accordion { display: none; }

    .hiw-e__mob-text {
      display: flex;
      align-items: flex-start;
      gap: var(--hiw-gap);
      padding: var(--hiw-space-sm) var(--hiw-space-sm) var(--hiw-space-lg);
      background: var(--hiw-color-bg);
      border-radius: var(--hiw-radius-lg);
      margin: var(--hiw-space-xs) var(--hiw-space-xs) 0;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      overflow: hidden;
    }
    .hiw-e__mob-num  { flex-shrink: 0; color: var(--hiw-color-text); }
    .hiw-e__mob-body {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      gap: var(--hiw-gap-sm);
    }
    .hiw-e__mob-title,
    .hiw-e__mob-desc { margin: 0; color: var(--hiw-color-text); }

    .hiw-e__visual {
      flex: 1 0 0;
      position: relative;
      overflow: hidden;
      width: 100%;
      margin-top: var(--hiw-space-md);
      aspect-ratio: unset;
    }

    .hiw-e__slide {
      padding: 0;
      align-items: flex-start;
      justify-content: flex-start;
      transition: transform 0.5s cubic-bezier(0.0, 0.0, 0.2, 1.0);
    }

    .hiw-e__mob-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 2rem; height: 2rem;
      background: rgba(0,0,0,0.35);
      border-radius: var(--hiw-radius-pill);
      color: var(--hiw-color-text);
      z-index: 2;
      cursor: pointer;
      padding: 0;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      transition: opacity 0.2s ease;
    }
    .hiw-e__mob-arrow--prev { left: var(--hiw-space-xs); }
    .hiw-e__mob-arrow--next { right: var(--hiw-space-xs); }
    .hiw-e__mob-arrow[disabled] { opacity: 0.25; cursor: default; }

    .hiw-e__slide picture { display: block; width: 100%; flex-shrink: 0; }
    .hiw-e__slide img {
      position: static;
      display: block;
      width: 96.4%;
      margin-left: 3.6%;
      height: auto;
      max-width: none; max-height: none;
      object-fit: unset;
      border-radius: var(--hiw-radius-md) 0 0 0;
    }

    .hiw-e__coming-soon {
      left: var(--hiw-space-xs);
      right: var(--hiw-space-xs);
      bottom: var(--hiw-space-xs);
      background: var(--hiw-color-bg);
      border-radius: var(--hiw-radius-md);
      padding: var(--hiw-space-xs);
      justify-content: flex-start;
      z-index: 1;
    }
    .hiw-e__platform-icons { order: -1; }

    .hiw-e__mob-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--hiw-space-xs);
      padding: var(--hiw-space-sm) 0 0;
    }
    .hiw-e__mob-dot {
      width: 0.5rem; height: 0.5rem;
      border-radius: var(--hiw-radius-pill);
      background: var(--hiw-color-muted);
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .hiw-e__mob-dot.is-active { background: var(--hiw-color-text); }
  }
</style>

<script>
(function () {

  var STEP_COUNT  = 5;
  var BG_COLORS   = ['#6d0092', '#005019', '#dbe96d', '#dbe96d', '#1877f2'];
  var _mobMode    = false;

  var section   = document.getElementById('hiw-e');
  var visual    = document.getElementById('hiw-eVisual');
  var highlight = document.getElementById('hiw-eHighlight');
  var card      = document.getElementById('hiw-eCard');
  var accordion = document.getElementById('hiw-eAccordion');
  var steps     = Array.prototype.slice.call(section.querySelectorAll('.hiw-e__step'));
  var slides    = Array.prototype.slice.call(section.querySelectorAll('.hiw-e__slide'));
  var _lastIdx  = -1;
  var remPx     = parseFloat(getComputedStyle(document.documentElement).fontSize);

  /* Dynamic style tag for transitions (created inline in embed) */
  var dynStyle  = document.getElementById('hiw-e-dynamic');

  function updateHighlight() {
    var active = accordion.querySelector('.hiw-e__step.is-active');
    if (!active) return;
    highlight.style.top    = (active.offsetTop    / remPx) + 'rem';
    highlight.style.height = (active.offsetHeight / remPx) + 'rem';
  }

  /* ── Config ── */
  var C = {
    scrollLength: 5,
    eases: {
      slide:     [0.00, 0.00, 0.20, 1.00],
      highlight: [0.00, 0.00, 0.20, 1.00],
      desc:      [0.00, 0.00, 0.20, 1.00],
      bg:        [0.00, 0.00, 0.20, 1.00],
    },
    trans: {
      highlightDur: 0.6,
      descDur:      0.6,
      colorDur:     0.5,
      slideDur:     0.6,
      bgDur:        0.6,
    },
  };

  function applyScrollLength() {
    if (_mobMode) return;
    section.style.height = (C.scrollLength * 100) + 'vh';
  }
  applyScrollLength();

  function applyTransitions() {
    var T = C.trans, E = C.eases;
    var be = function (e) { return 'cubic-bezier(' + e.join(',') + ')'; };
    dynStyle.textContent =
      '.hiw-e__highlight { transition: top ' + T.highlightDur + 's ' + be(E.highlight) + ', height ' + T.highlightDur + 's ' + be(E.highlight) + '; }\n' +
      '.hiw-e__step.is-active .hiw-e__step-desc { transition: max-height ' + T.descDur + 's ' + be(E.desc) + ', opacity ' + (Math.round(T.descDur * 0.75 * 100) / 100) + 's ' + be(E.desc) + '; }\n' +
      '.hiw-e__step-num, .hiw-e__step-title { transition: color ' + T.colorDur + 's ease; }\n' +
      '.hiw-e__slide { transition: transform ' + T.slideDur + 's ' + be(E.slide) + '; }\n' +
      '.hiw-e__visual { transition: background-color ' + T.bgDur + 's ' + be(E.bg) + '; }';
  }

  /* ── Scroll progress ── */
  function scrollProgress() {
    var top      = section.getBoundingClientRect().top;
    var scrollable = section.offsetHeight - window.innerHeight;
    if (top > 0) return 0;
    return Math.max(0, Math.min(1, -top / scrollable));
  }

  /* ── Render ── */
  function tick(p) {
    var frac = p * (STEP_COUNT - 1);
    var idx  = Math.max(0, Math.min(STEP_COUNT - 1, Math.round(frac)));

    steps.forEach(function (s, i) {
      s.classList.toggle('is-active', i === idx);
      s.classList.toggle('is-read',   i < idx);
    });

    if (idx !== _lastIdx) {
      _lastIdx = idx;
      requestAnimationFrame(updateHighlight);
      slides.forEach(function (slide, i) {
        slide.style.transform = i === idx ? 'translateY(0%)' : (i < idx ? 'translateY(-100%)' : 'translateY(100%)');
        slide.style.zIndex    = i === idx ? 1 : 0;
      });
      visual.style.backgroundColor = BG_COLORS[idx];
    }
  }

  /* ── Card auto-height ── */
  function sizeCard() {
    if (_mobMode) return;
    var accW = accordion.offsetWidth;
    if (!accW) return;

    var clone = accordion.cloneNode(true);
    clone.style.cssText =
      'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;' +
      'width:' + accW + 'px;height:auto;overflow:visible;min-height:0;';
    document.body.appendChild(clone);

    var cSteps = clone.querySelectorAll('.hiw-e__step');
    var cDescs = clone.querySelectorAll('.hiw-e__step-desc');
    var maxH   = 0;

    for (var ci = 0; ci < STEP_COUNT; ci++) {
      cSteps.forEach(function (s, j) {
        s.classList.toggle('is-active', j === ci);
        s.classList.toggle('is-read',   j < ci);
      });
      cDescs[ci].style.cssText = 'max-height:none;opacity:1;transition:none;overflow:visible;';
      var h = clone.scrollHeight;
      if (h > maxH) maxH = h;
      cDescs[ci].style.cssText = '';
    }

    document.body.removeChild(clone);
    if (!maxH) return;

    var prevH = card.style.height;
    card.style.height = '';
    var clampH = card.offsetHeight;
    card.style.height = prevH;

    var finalH = Math.max(maxH, clampH);
    card.style.height = finalH !== clampH ? (finalH / 16) + 'rem' : '';
  }

  sizeCard();
  document.fonts.ready.then(sizeCard);

  /* ── Mobile card height ── */
  var mobTextEl  = document.getElementById('hiw-eMobText');
  var mobNumEl   = mobTextEl && mobTextEl.querySelector('.hiw-e__mob-num');
  var mobTitleEl = mobTextEl && mobTextEl.querySelector('.hiw-e__mob-title');
  var mobDescEl  = mobTextEl && mobTextEl.querySelector('.hiw-e__mob-desc');

  function sizeMobCard() {
    if (!_mobMode || !mobTextEl) return;
    var cardW = card.offsetWidth;
    if (!cardW) return;

    var clone = mobTextEl.cloneNode(true);
    clone.style.cssText =
      'position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;' +
      'width:' + mobTextEl.offsetWidth + 'px;height:auto;';
    document.body.appendChild(clone);

    var cloneNum   = clone.querySelector('.hiw-e__mob-num');
    var cloneTitle = clone.querySelector('.hiw-e__mob-title');
    var cloneDesc  = clone.querySelector('.hiw-e__mob-desc');
    var maxMobH = 0;
    for (var si = 0; si < STEP_COUNT; si++) {
      if (cloneNum)   cloneNum.textContent   = stepData[si].num;
      if (cloneTitle) cloneTitle.textContent = stepData[si].title;
      if (cloneDesc)  cloneDesc.textContent  = stepData[si].desc;
      var h = clone.offsetHeight;
      if (h > maxMobH) maxMobH = h;
    }
    document.body.removeChild(clone);
    if (!maxMobH) return;

    var imgDisplayW = cardW * 0.964;
    var maxImgH = 0;
    slides.forEach(function (slide) {
      var img = slide.querySelector('img');
      if (img && img.naturalWidth) {
        var imgH = Math.round(img.naturalHeight * imgDisplayW / img.naturalWidth);
        if (imgH > maxImgH) maxImgH = imgH;
      }
    });
    if (!maxImgH) return;

    mobTextEl.style.height = (maxMobH / remPx) + 'rem';
    var spaceXs = remPx * 0.5;
    var spaceMd = remPx * 2;
    card.style.height = ((spaceXs + maxMobH + spaceMd + maxImgH) / remPx) + 'rem';
  }

  window.addEventListener('load', function () { if (_mobMode) sizeMobCard(); });
  document.fonts.ready.then(function () { if (_mobMode) sizeMobCard(); });

  /* ── Init without transitions ── */
  card.style.opacity = '0';
  highlight.style.transition = 'none';
  slides.forEach(function (slide, i) { slide.style.transition = 'none'; });
  visual.style.transition = 'none';
  updateHighlight();
  slides.forEach(function (slide, i) {
    slide.style.transform = i === 0 ? 'translateY(0%)' : 'translateY(100%)';
    slide.style.zIndex    = i === 0 ? 1 : 0;
  });
  visual.style.backgroundColor = BG_COLORS[0];

  /* ── LERP loop ── */
  var LERP        = 0.04;
  var targetP     = 0;
  var currentP    = 0;
  var _rafReady   = false;
  var _transReady = false;

  requestAnimationFrame(function loop() {
    if (_mobMode) { requestAnimationFrame(loop); return; }
    targetP = scrollProgress();
    if (!_rafReady) { currentP = targetP; _rafReady = true; }
    currentP += (targetP - currentP) * LERP;
    tick(currentP);
    if (!_transReady) {
      _transReady = true;
      card.style.opacity = '';
      requestAnimationFrame(function () {
        applyTransitions();
        highlight.style.transition = '';
        slides.forEach(function (slide) { slide.style.transition = ''; });
        visual.style.transition = '';
      });
    }
    requestAnimationFrame(loop);
  });

  /* ── Click to jump ── */
  steps.forEach(function (btn, i) {
    btn.addEventListener('click', function () {
      var frac       = i / (STEP_COUNT - 1);
      var scrollable = section.offsetHeight - window.innerHeight;
      var oldIdx     = _lastIdx;

      slides.forEach(function (slide, j) {
        if (j !== oldIdx && j !== i) {
          slide.style.transition = 'none';
          slide.style.transform  = j < i ? 'translateY(-100%)' : 'translateY(100%)';
          slide.style.zIndex     = 0;
        }
      });

      targetP  = frac;
      currentP = frac;
      window.scrollTo(0, section.offsetTop + frac * scrollable);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          slides.forEach(function (slide) { slide.style.transition = ''; });
        });
      });
    });
  });

  /* ── Resize observers ── */
  new ResizeObserver(function () {
    remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
    highlight.style.transition = 'none';
    updateHighlight();
    requestAnimationFrame(function () { highlight.style.transition = ''; });
    if (!_mobMode) { sizeCard(); applyScrollLength(); }
  }).observe(accordion);

  new ResizeObserver(function () {
    remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
    if (_mobMode) { sizeMobCard(); }
  }).observe(card);

  /* ── Mobile carousel ── */
  var MOB          = window.matchMedia('(max-width: 767px)');
  var _mobIdx      = 0;
  var _mobTimer    = null;
  var MOB_INTERVAL = 5000;

  var stepData = steps.map(function (btn) {
    return {
      num:   btn.querySelector('.hiw-e__step-num').textContent,
      title: btn.querySelector('.hiw-e__step-title').textContent,
      desc:  btn.querySelector('.hiw-e__step-desc').textContent,
    };
  });

  var mobDots    = Array.prototype.slice.call(section.querySelectorAll('.hiw-e__mob-dot'));
  var mobPrevBtn = document.getElementById('hiw-eMobPrev');
  var mobNextBtn = document.getElementById('hiw-eMobNext');

  function mobUpdateText(idx) {
    if (!mobNumEl) return;
    mobNumEl.textContent   = stepData[idx].num;
    mobTitleEl.textContent = stepData[idx].title;
    mobDescEl.textContent  = stepData[idx].desc;
  }
  function mobUpdateDots(idx) {
    mobDots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === idx); });
  }
  function mobUpdateArrows(idx) {
    if (!mobPrevBtn || !mobNextBtn) return;
    mobPrevBtn.disabled = (idx === 0);
    mobNextBtn.disabled = (idx === STEP_COUNT - 1);
  }

  function mobGoTo(idx, animate) {
    idx = Math.max(0, Math.min(STEP_COUNT - 1, idx));
    _mobIdx = idx;
    slides.forEach(function (slide, i) {
      if (!animate) slide.style.transition = 'none';
      slide.style.transform = i === idx ? 'translateX(0%)' : (i < idx ? 'translateX(-100%)' : 'translateX(100%)');
      slide.style.zIndex    = i === idx ? 1 : 0;
    });
    visual.style.backgroundColor = BG_COLORS[idx];
    card.style.backgroundColor   = BG_COLORS[idx];
    mobUpdateText(idx);
    mobUpdateDots(idx);
    mobUpdateArrows(idx);
    if (!animate) {
      requestAnimationFrame(function () {
        slides.forEach(function (slide) { slide.style.transition = ''; });
      });
    }
  }

  function mobStopTimer()  { if (_mobTimer) { clearInterval(_mobTimer); _mobTimer = null; } }
  function mobStartTimer() {
    mobStopTimer();
    _mobTimer = setInterval(function () { mobGoTo((_mobIdx + 1) % STEP_COUNT, true); }, MOB_INTERVAL);
  }

  var _swipeInited  = false;
  var _arrowsInited = false;

  function mobInitSwipe() {
    if (_swipeInited) return;
    _swipeInited = true;
    var touchStartX = 0, touchStartY = 0;
    visual.addEventListener('touchstart', function (e) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      mobStopTimer();
    }, { passive: true });
    visual.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - touchStartX;
      var dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        mobGoTo(dx < 0 ? _mobIdx + 1 : _mobIdx - 1, true);
      }
      mobStartTimer();
    }, { passive: true });
  }

  function mobInitArrows() {
    if (_arrowsInited) return;
    _arrowsInited = true;
    if (!mobPrevBtn || !mobNextBtn) return;
    mobPrevBtn.addEventListener('click', function () { mobStopTimer(); mobGoTo(_mobIdx - 1, true); mobStartTimer(); });
    mobNextBtn.addEventListener('click', function () { mobStopTimer(); mobGoTo(_mobIdx + 1, true); mobStartTimer(); });
  }

  document.addEventListener('keydown', function (e) {
    if (!_mobMode) return;
    if (e.key === 'ArrowLeft')  { mobStopTimer(); mobGoTo(_mobIdx - 1, true); mobStartTimer(); }
    if (e.key === 'ArrowRight') { mobStopTimer(); mobGoTo(_mobIdx + 1, true); mobStartTimer(); }
  });

  function destroyMobile() {
    _mobMode = false;
    mobStopTimer();
    mobTextEl.style.height     = '';
    card.style.backgroundColor = '';
    slides.forEach(function (slide) {
      slide.style.transform  = '';
      slide.style.zIndex     = '';
      slide.style.transition = '';
    });
    applyScrollLength();
    sizeCard();
  }

  function initMobile() {
    _mobMode = true;
    mobGoTo(0, false);
    card.style.opacity = '';
    sizeMobCard();
    requestAnimationFrame(function () { visual.style.transition = ''; });
    mobInitSwipe();
    mobInitArrows();
    mobStartTimer();
  }

  if (MOB.matches) { initMobile(); }
  MOB.addEventListener('change', function (e) {
    if (e.matches) { initMobile(); } else { destroyMobile(); }
  });

})();
</script>
