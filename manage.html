<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bïrch — Manage</title>
<link rel="stylesheet" href="design-system/tokens.css" />
<link rel="stylesheet" href="design-system/webflow-env.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--color-bg);
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ─────────────────────────────────────────
     HERO — pills only (bg / subtitle / CTA added in Webflow)
     Figma: desktop 1280 (node 17900:3089) / mobile (node 17906:3401)
  ───────────────────────────────────────── */

  .hero {
    height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--color-bg);
    overflow: hidden; /* clip flag tip / staircase from expanding page width */
  }

  /* Word pills — shared visual base for both desktop rows and mobile staircase */
  .hero__pill {
    display: block;
    font-size: var(--ps);
    padding: 0.058em 0.462em 0.154em; /* pt=3px px=24px pb=8px at 52px design */
    font-family: var(--font);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    color: var(--color-text-inverted);
  }
  .hero__pill--sq   { border-radius: 0.308em; } /* 16px / 52px */
  .hero__pill--pill { border-radius: var(--radius-pill); }
  .hero__pill--dotted {
    background: transparent;
    color: var(--color-text);
    border: 0.108em dotted var(--color-text); /* 5.6px / 52px */
    padding: calc(0.058em - 0.108em) calc(0.462em - 0.108em) calc(0.154em - 0.108em); /* border eats into padding so box stays same size */
  }

  .hero__pill--light-blue { background: var(--color-accent-light-blue); }
  .hero__pill--green      { background: var(--color-accent-green); }
  .hero__pill--indigo     { background: var(--color-accent-indigo); color: var(--color-text); }

  /* "Scale" flag — ribbon shape, flat left edge / pointed right edge */
  .hero__flag {
    position: relative;
    flex-shrink: 0;
    width: 3.25em;   /* 169 / 52 */
    height: 1.481em; /* 77 / 52 */
    font-size: var(--ps);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero__flag::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: -0.212em;    /* -11 / 52 */
    bottom: -0.172em; /* 97 - 77 - 11 = 9 → 9 / 52 */
    background: #FBBC04; /* hardcoded — one-off decorative color, not a design token */
    clip-path: polygon(100% 85.567%, 0% 100%, 0% 0%, 100% 14.433%);
  }
  .hero__flag span {
    position: relative;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--color-text-inverted);
  }

  /* Campaign icon square */
  .hero__icon {
    flex-shrink: 0;
    width: 1.481em;  /* 77 / 52 */
    height: 1.481em;
    font-size: var(--ps);
    border-radius: 0.308em;
    background: var(--color-accent-light-blue);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero__icon svg {
    width: 1.0385em; /* 54 / 52 */
    height: 1.0385em;
    stroke: var(--color-accent-blue);
  }

  /* ── Desktop — two centered rows ── */
  .hero__h1--dt {
    --ps: var(--text-pill-size); /* shared token — design-system/tokens.css */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.365em; /* 19 / 52 */
    font-size: var(--ps);
  }
  .hero__row {
    display: flex;
    align-items: center;
    gap: 0.154em; /* 8 / 52 */
  }

  /* Mobile staircase hidden on desktop */
  .hero__h1--mb { display: none; }

  /* ─────────────────────────────────────────
     MOBILE ≤767px — absolute staircase
     (composition differs from ai-promo — exact per-element positions)
  ───────────────────────────────────────── */
  @media (max-width: 767px) {
    .hero__h1--dt { display: none; }
    .hero__h1--mb {
      display: block;
      position: relative;
      --ps: var(--text-pill-size-mobile); /* shared token — design-system/tokens.css */
      font-size: var(--ps);
      width: 8.068em;  /* 233 / 28.889 */
      height: 8.517em; /* 246 / 28.889 */
    }
    .hero__h1--mb .hero__flag,
    .hero__h1--mb .hero__pill,
    .hero__h1--mb .hero__icon {
      position: absolute;
    }
    .hero__mflag        { left: 2.389em; top: 0.227em; }
    .hero__mcampaigns   { left: 0.208em; top: 2.008em; }
    .hero__micon        { left: 1.800em; top: 3.635em; }
    .hero__mwith        { left: 3.462em; top: 3.635em; }
    .hero__mai          { left: 0;       top: 5.401em; }
    .hero__mad          { left: 6.012em; top: 5.401em; }
    .hero__mautomation  { left: 1.142em; top: 7.026em; }
  }

  /* ─────────────────────────────────────────
     AI-PROMO PILLS — comparison block
     Same composition as ai-promo.html hero, reusing the shared
     --text-pill-size / --text-pill-size-mobile tokens.
     Namespaced "promo__" so it doesn't collide with .hero__* above.
     Mobile variant only shows via the ≤767px media query, same as hero.
  ───────────────────────────────────────── */
  .promo {
    padding: var(--space-xl) var(--pad-horizontal);
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px dashed #2a2a2a;
  }
  .promo__pill {
    display: block;
    font-size: var(--ps);
    padding: 0.058em 0.462em 0.154em;
    font-family: var(--font);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.02em;
    white-space: nowrap;
    color: var(--color-text-inverted);
  }
  .promo__pill--sq   { border-radius: 0.308em; }
  .promo__pill--pill { border-radius: var(--radius-pill); }
  .promo__pill--light-blue { background: var(--color-accent-light-blue); }
  .promo__pill--blue       { background: var(--color-accent-blue);   color: var(--color-text); }
  .promo__pill--green      { background: var(--color-accent-green); }
  .promo__pill--indigo     { background: var(--color-accent-indigo); color: var(--color-text); }

  .promo__deco-cols {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    font-size: var(--ps);
    width:  1.596em;
    height: 1.312em;
  }
  .promo__col {
    position: absolute;
    bottom: 0;
    width:         0.769em;
    border-radius: 0.199em;
  }
  .promo__col--purple { left: 0;       height: 78.9%; background: var(--color-accent-purple); }
  .promo__col--blue   { left: 0.827em; height: 100%;  background: var(--color-accent-blue); }

  .promo__deco-bars {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.058em;
    flex-shrink: 0;
    font-size: var(--ps);
    width:  1.654em;
    height: 1.312em;
  }
  .promo__bar { height: 0.399em; border-radius: var(--radius-pill); }
  .promo__bar--lb   { width: 100%;  background: var(--color-accent-light-blue); }
  .promo__bar--pink { width: 67.4%; background: var(--color-accent-pink); }
  .promo__bar--red  { width: 34.9%; background: var(--color-accent-red); }

  .promo__h1--dt {
    --ps: var(--text-pill-size);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap-sm);
    font-size: var(--ps);
  }
  .promo__row { display: flex; align-items: center; gap: var(--gap-sm); }

  .promo__h1--mb { display: none; }

  @media (max-width: 767px) {
    .promo__h1--dt { display: none; }
    .promo__h1--mb {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.15em;
      width: fit-content;
      --ps: var(--text-pill-size-mobile);
      font-size: var(--ps);
    }
    .promo__step { display: flex; align-items: center; gap: 0.1em; flex-shrink: 0; }
    .promo__step--a { margin-left: 0; }
    .promo__step--b { margin-left: 0.5em; }
    .promo__step--c { align-self: flex-start; margin-left: 0.6em; }
    .promo__step--d { margin-left: 1.9em; }
    .promo__step--e { align-self: flex-start; margin-left: 2.8em; }
    .promo__h1--mb .promo__pill--green.promo__pill--sq { margin-right: 0.2em; }
  }
</style>
</head>

───────────────────────────────────────── -->

  <!-- Desktop: two rows -->

      <div class="hero__flag"><span>Scale</span></div>

  </div>

</section>
